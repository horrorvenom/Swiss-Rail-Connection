<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Streckenkenntnis — Register</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --graphit:#14181b; --panel:#1d2327; --panel2:#232b30; --linie:#303b41;
  --kreide:#e8edef; --stahl:#8a9aa3;
  --fahrt:#2fbf71; --warnung:#f2b705; --halt:#e23d28; --lernen:#4da3ff;
  --ui:'Barlow Semi Condensed',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--graphit);color:var(--kreide);font-family:var(--ui);font-size:17px;line-height:1.35}
body.angemeldet{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

header{position:sticky;top:0;z-index:30;background:var(--graphit);border-bottom:1px solid var(--linie);
  padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
header[hidden]{display:none}
.marke{display:flex;align-items:baseline;gap:10px}
.marke h1{font-size:21px;text-transform:uppercase;letter-spacing:.06em}
.marke .kennung{font-family:var(--mono);font-size:11px;color:var(--stahl);letter-spacing:.14em;margin-left:auto}
.statuszeile{font-family:var(--mono);font-size:11px;color:var(--stahl);margin-top:4px;min-height:14px;letter-spacing:.06em}
.statuszeile.fehler{color:var(--halt)}

main{padding:16px 16px 24px;max-width:820px;margin:0 auto}
.abschnitt{margin-bottom:26px}
.abschnitt>h2{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--stahl);
  font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

.lampe{width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:#39454b}
.lampe.gueltig{background:var(--fahrt);box-shadow:0 0 10px rgba(47,191,113,.55)}
.lampe.warnung{background:var(--warnung);box-shadow:0 0 10px rgba(242,183,5,.5)}
.lampe.abgelaufen{background:var(--halt);box-shadow:0 0 10px rgba(226,61,40,.55);animation:puls 2.4s ease-in-out infinite}
.lampe.ausbildung{background:var(--lernen);box-shadow:0 0 10px rgba(77,163,255,.45)}
.lampe.klein{width:9px;height:9px;box-shadow:none}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.lampe.abgelaufen{animation:none}}

.kacheln{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kachel{background:var(--panel);border:1px solid var(--linie);border-radius:3px;padding:12px}
.kachel .zahl{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.kachel .bez{font-size:13px;color:var(--stahl);margin-top:6px;display:flex;align-items:center;gap:7px;
  text-transform:uppercase;letter-spacing:.08em}

.karte{background:var(--panel);border:1px solid var(--linie);border-radius:3px;padding:12px 13px;margin-bottom:8px}
.kopfzeile{display:flex;align-items:center;gap:10px}
.kopfzeile .titel{flex:1;min-width:0;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linienr{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--panel2);
  border:1px solid var(--linie);border-radius:2px;padding:2px 6px;color:var(--stahl)}
.frist{font-family:var(--mono);font-size:12px;color:var(--stahl);margin-top:6px}
.frist b{font-weight:600;color:var(--kreide)}
.frist.rot b{color:var(--halt)} .frist.gelb b{color:var(--warnung)}

.band{display:flex;align-items:center;margin:11px 0 3px;overflow:hidden}
.band .bp{display:flex;align-items:center;flex:0 0 auto}
.band .knoten{width:7px;height:7px;border-radius:50%;background:var(--stahl)}
.band .knoten.rand{width:9px;height:9px;background:var(--kreide)}
.band .schiene{height:1px;background:var(--linie);flex:1 1 auto;min-width:10px}
.band .code{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--stahl);padding:0 5px;white-space:nowrap}
.band .code.rand{color:var(--kreide);font-weight:600}
.band .rest{font-family:var(--mono);font-size:11px;color:#5f6d75;padding:0 5px}

.balken{height:3px;background:#2a3238;border-radius:2px;overflow:hidden;margin-top:9px}
.balken i{display:block;height:100%}

.aktionen{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--linie);background:var(--panel2);border-radius:2px;padding:8px 12px;
  font-size:14px;font-weight:500;color:var(--kreide)}
.btn:active{background:#2b353b}
.btn.haupt{background:var(--kreide);color:var(--graphit);border-color:var(--kreide);font-weight:600}
.btn.gefahr{color:var(--halt);border-color:#4a2b26}
.btn.voll{width:100%;text-align:center}
.btn.klein{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5}

.suche{width:100%;background:var(--panel);border:1px solid var(--linie);border-radius:2px;padding:11px 12px;margin-bottom:9px;outline:none}
.suche:focus{border-color:#4a5960}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--linie);background:transparent;border-radius:2px;padding:6px 10px;
  font-size:13px;color:var(--stahl);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.07em}
.chip.an{background:var(--panel2);color:var(--kreide);border-color:#4a5960}

.liste{background:var(--panel);border:1px solid var(--linie);border-radius:3px;overflow:hidden}
.punkt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--linie)}
.punkt:last-child{border-bottom:none}
.punkt .abk{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.09em;background:var(--panel2);
  border:1px solid var(--linie);border-radius:2px;padding:5px 7px;min-width:52px;text-align:center}
.punkt .txt{flex:1;min-width:0}
.punkt .txt .n{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punkt .txt .m{display:block;font-size:12px;color:var(--stahl)}
.ampel{display:flex;gap:4px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--stahl)}
.ampel span{display:flex;align-items:center;gap:3px}

.leer{border:1px dashed var(--linie);border-radius:3px;padding:22px 16px;text-align:center;color:var(--stahl);font-size:15px}
.leer b{display:block;color:var(--kreide);font-weight:600;font-size:17px;margin-bottom:5px}

label{display:block;margin-bottom:12px}
label span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--stahl);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;background:var(--graphit);border:1px solid var(--linie);border-radius:2px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#5b6b73}
textarea{resize:vertical;min-height:64px;font-size:15px}
.zweispaltig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hinweis{font-size:13px;color:var(--stahl);margin:-6px 0 12px}

.hintergrund{position:fixed;inset:0;background:rgba(8,10,12,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.hintergrund[hidden]{display:none}
.blatt{background:var(--panel);border:1px solid var(--linie);border-bottom:none;border-radius:6px 6px 0 0;
  width:100%;max-width:820px;max-height:92vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.blatt h3{font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.blatt h3 button{font-family:var(--mono);font-size:13px;color:var(--stahl)}

.bpwahl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:34px}
.bptag{font-family:var(--mono);font-size:12px;letter-spacing:.07em;background:var(--panel2);border:1px solid var(--linie);
  border-radius:2px;padding:6px 8px;display:flex;align-items:center;gap:7px}
.bptag button{color:var(--stahl);font-size:15px;line-height:1}
.bpwahl .platzhalter{color:var(--stahl);font-size:14px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--panel);
  border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav button{flex:1;padding:9px 2px 10px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--stahl);
  display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;border-top:2px solid transparent;margin-top:-1px}
nav button.an{color:var(--kreide);border-top-color:var(--kreide)}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* Anmeldung */
.tor{max-width:420px;margin:0 auto;padding:56px 20px 40px}
.tor .logo{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--stahl);margin-bottom:8px}
.tor h1{font-size:30px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.tor .unter{color:var(--stahl);font-size:15px;margin-bottom:26px;line-height:1.45}
.wechsel{display:flex;border:1px solid var(--linie);border-radius:2px;margin-bottom:20px;overflow:hidden}
.wechsel button{flex:1;padding:10px;font-size:14px;font-weight:600;color:var(--stahl);letter-spacing:.05em}
.wechsel button.an{background:var(--panel2);color:var(--kreide)}
.gleis{height:1px;background:var(--linie);position:relative;margin:30px 0}
.gleis::before,.gleis::after{content:'';position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--linie)}
.gleis::before{left:0} .gleis::after{right:0}

.rollenschild{font-family:var(--mono);font-size:10px;letter-spacing:.12em;border:1px solid var(--linie);
  border-radius:2px;padding:3px 6px;color:var(--stahl)}
.rollenschild.admin{color:var(--warnung);border-color:#4d411a}
.fussnote{font-size:12px;color:var(--stahl);line-height:1.5}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--lernen);outline-offset:2px}
</style>
</head>
<body>

<header id="kopf" hidden>
  <div class="marke">
    <h1>Streckenkenntnis</h1>
    <span class="kennung" id="kennung"></span>
  </div>
  <div class="statuszeile" id="statuszeile"></div>
</header>

<main id="ansicht"></main>
<nav id="navigation" hidden></nav>

<div class="hintergrund" id="hintergrund" hidden><div class="blatt" id="blatt"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   ZUGANGSDATEN — im Supabase-Dashboard unter
   Project Settings > API zu finden. Nur diese zwei Zeilen anpassen.
   ============================================================ */
const SUPABASE_URL      = 'https://rjydrpkxzkacnbblkyzf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bII4ZamzpUBFq_6EKsGMZA_mxrTD9mS';
/* ========================================================== */

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let S = {
  user:null, profil:null,
  konfig:{ gueltig_monate:12, warn_tage:60 },
  punkte:[], strecken:[], kenntnis:{}, fahrten:[],
  teamProfile:[], teamStand:[]
};
let ANSICHT='uebersicht', SUCHE='', FILTER='alle', TEAMMODUS='mitarbeiter', ENTWURF=null, TORMODUS='anmelden';

/* ---------- Werkzeuge ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const istAdmin = () => S.profil && S.profil.rolle === 'admin';

function heute(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function monateDazu(iso,m){ const d=new Date(iso+'T00:00:00'); const t=d.getDate(); d.setMonth(d.getMonth()+m);
  if(d.getDate()<t) d.setDate(0); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function tageBis(iso){ return Math.round((new Date(iso+'T00:00:00')-new Date(heute()+'T00:00:00'))/864e5); }
function datum(iso){ if(!iso) return '—'; const [j,m,t]=String(iso).slice(0,10).split('-'); return `${t}.${m}.${j}`; }

function meldung(text, fehler){
  const z=$('statuszeile'); if(!z) return;
  z.textContent=text; z.className='statuszeile'+(fehler?' fehler':'');
  clearTimeout(meldung._t); meldung._t=setTimeout(()=>{ z.textContent=''; }, fehler?6000:2600);
}
function fehler(e){ meldung(e && e.message ? e.message : String(e), true); }

/* ---------- Fachlogik ---------- */
function punkt(id){ return S.punkte.find(p=>p.id===id); }
function code(id){ const p=punkt(id); return p?p.abk:'??'; }
function meineKenntnis(sid){ return S.kenntnis[sid] || { status:'keine', erwerb:null, letzte_befahrung:null, notiz:'' }; }

function letzteBefahrung(sid){
  const k=meineKenntnis(sid); let d=k.letzte_befahrung||'';
  S.fahrten.forEach(f=>{ if(f.strecke_id===sid && f.datum>d) d=f.datum; });
  return d||'';
}
function ablauf(sid){
  const k=meineKenntnis(sid);
  if(k.status!=='vorhanden') return '';
  const l=letzteBefahrung(sid), e=k.erwerb||'';
  const basis=(l>e?l:e)||'';
  return basis ? monateDazu(basis, S.konfig.gueltig_monate) : '';
}
function zustand(sid){
  const k=meineKenntnis(sid);
  if(k.status==='keine') return 'keine';
  if(k.status==='ausbildung') return 'ausbildung';
  const a=ablauf(sid); if(!a) return 'gueltig';
  const t=tageBis(a);
  if(t<0) return 'abgelaufen';
  if(t<=S.konfig.warn_tage) return 'warnung';
  return 'gueltig';
}
const ZTEXT={gueltig:'Kenntnis gültig',warnung:'Läuft bald ab',abgelaufen:'Abgelaufen',ausbildung:'In Ausbildung',keine:'Keine Kenntnis'};
const ZFARBE={gueltig:'var(--fahrt)',warnung:'var(--warnung)',abgelaufen:'var(--halt)',ausbildung:'var(--lernen)',keine:'#39454b'};

/* ---------- Daten laden ---------- */
async function alleLaden(){
  const [kf,bp,st,sp,ke,fa] = await Promise.all([
    db.from('konfiguration').select('*').eq('id',1).maybeSingle(),
    db.from('betriebspunkt').select('*'),
    db.from('strecke').select('*'),
    db.from('strecke_punkt').select('*').order('reihenfolge'),
    db.from('kenntnis').select('*').eq('benutzer_id', S.user.id),
    db.from('fahrt').select('*').eq('benutzer_id', S.user.id).order('datum',{ascending:false}).limit(400)
  ]);
  const err=[kf,bp,st,sp,ke,fa].find(r=>r.error);
  if(err){ fehler(err.error); return; }

  if(kf.data) S.konfig=kf.data;
  S.punkte=bp.data||[];
  const zuordnung={};
  (sp.data||[]).forEach(r=>{ (zuordnung[r.strecke_id] ||= []).push(r.punkt_id); });
  S.strecken=(st.data||[]).map(s=>({ ...s, punkte: zuordnung[s.id]||[] }));
  S.kenntnis={}; (ke.data||[]).forEach(k=>{ S.kenntnis[k.strecke_id]=k; });
  S.fahrten=fa.data||[];

  if(istAdmin()) await teamLaden();
}
async function teamLaden(){
  const [pr,vw]=await Promise.all([
    db.from('profil').select('*').order('name'),
    db.from('v_kenntnis_stand').select('*')
  ]);
  if(pr.error||vw.error){ fehler((pr.error||vw.error)); return; }
  S.teamProfile=pr.data||[]; S.teamStand=vw.data||[];
}

/* ---------- Streckenband ---------- */
function band(s){
  const ids=(s.punkte||[]).filter(id=>punkt(id));
  if(!ids.length) return '<div class="band"><span class="rest">keine Betriebspunkte erfasst</span></div>';
  let sicht=ids, gekuerzt=0;
  if(ids.length>6){ sicht=[...ids.slice(0,3),null,...ids.slice(-2)]; gekuerzt=ids.length-5; }
  let h='<div class="band">';
  sicht.forEach((id,i)=>{
    if(i>0) h+='<span class="schiene"></span>';
    if(id===null){ h+=`<span class="rest">+${gekuerzt}</span>`; return; }
    const r=(i===0||i===sicht.length-1)?' rand':'';
    h+=`<span class="bp"><span class="knoten${r}"></span><span class="code${r}">${esc(code(id))}</span></span>`;
  });
  return h+'</div>';
}

function streckeKarte(s){
  const z=zustand(s.id), a=ablauf(s.id), t=a?tageBis(a):null;
  let frist;
  if(z==='abgelaufen') frist=`<div class="frist rot">Abgelaufen am <b>${datum(a)}</b> · ${Math.abs(t)} Tage überfällig</div>`;
  else if(z==='warnung') frist=`<div class="frist gelb">Gültig bis <b>${datum(a)}</b> · noch ${t} Tage</div>`;
  else if(z==='gueltig'&&a) frist=`<div class="frist">Gültig bis <b>${datum(a)}</b> · noch ${t} Tage</div>`;
  else if(z==='gueltig') frist=`<div class="frist">Kein Datum erfasst — Frist nicht berechenbar</div>`;
  else if(z==='ausbildung') frist=`<div class="frist">In Ausbildung${meineKenntnis(s.id).erwerb?' · seit '+datum(meineKenntnis(s.id).erwerb):''}</div>`;
  else frist=`<div class="frist">Noch keine Kenntnis erfasst</div>`;

  let balken='';
  if(a&&['gueltig','warnung','abgelaufen'].includes(z)){
    const anteil=Math.max(0,Math.min(100,(t/(S.konfig.gueltig_monate*30.4))*100));
    balken=`<div class="balken"><i style="width:${anteil.toFixed(1)}%;background:${ZFARBE[z]}"></i></div>`;
  }
  const darfStamm = istAdmin() || s.erstellt_von===S.user.id;
  return `<div class="karte">
    <div class="kopfzeile">
      <span class="lampe ${z}" title="${ZTEXT[z]}"></span>
      <span class="titel">${esc(s.name)}</span>
      ${s.linie?`<span class="linienr">${esc(s.linie)}</span>`:''}
    </div>
    ${band(s)}${frist}${balken}
    <div class="aktionen">
      <button class="btn haupt" data-tat="gefahren" data-id="${s.id}">Heute gefahren</button>
      <button class="btn" data-tat="kenntnis-bearbeiten" data-id="${s.id}">Kenntnis</button>
      ${darfStamm?`<button class="btn" data-tat="strecke-bearbeiten" data-id="${s.id}">Strecke</button>`:''}
    </div>
  </div>`;
}

/* ============================================================
   Ansichten
   ============================================================ */
function ansichtUebersicht(){
  const z={gueltig:0,warnung:0,abgelaufen:0,ausbildung:0,keine:0};
  S.strecken.forEach(s=>z[zustand(s.id)]++);
  const dringend=S.strecken.filter(s=>['abgelaufen','warnung'].includes(zustand(s.id)))
    .sort((a,b)=>(ablauf(a.id)||'9999').localeCompare(ablauf(b.id)||'9999'));

  if(!S.strecken.length){
    return `<div class="leer"><b>Noch keine Strecken im System</b>
      Die Strecken sind für alle Mitarbeitenden gemeinsam. Erfasse zuerst Betriebspunkte, dann Strecken.</div>
      <div style="height:12px"></div>
      <button class="btn haupt voll" data-tat="strecke-neu">Erste Strecke erfassen</button>`;
  }
  return `
  <div class="abschnitt">
    <h2>${esc(S.profil.name||'Mein Stand')} · ${datum(heute())}</h2>
    <div class="kacheln">
      <div class="kachel"><div class="zahl">${z.gueltig}</div><div class="bez"><span class="lampe gueltig klein"></span>Gültig</div></div>
      <div class="kachel"><div class="zahl">${z.warnung}</div><div class="bez"><span class="lampe warnung klein"></span>Läuft ab</div></div>
      <div class="kachel"><div class="zahl">${z.abgelaufen}</div><div class="bez"><span class="lampe abgelaufen klein"></span>Abgelaufen</div></div>
      <div class="kachel"><div class="zahl">${z.ausbildung}</div><div class="bez"><span class="lampe ausbildung klein"></span>Ausbildung</div></div>
    </div>
  </div>
  <div class="abschnitt">
    <h2>Braucht Aufmerksamkeit <span class="mono">${dringend.length}</span></h2>
    ${dringend.length?dringend.map(streckeKarte).join('')
      :`<div class="leer">Keine Strecke läuft in den nächsten ${S.konfig.warn_tage} Tagen ab.</div>`}
  </div>
  <div class="fussnote">Frist = letzte Befahrung plus ${S.konfig.gueltig_monate} Monate. Die Regel gilt für den ganzen Betrieb und wird vom Administrator gesetzt.</div>`;
}

function ansichtStrecken(){
  const q=SUCHE.toLowerCase();
  let liste=S.strecken.filter(s=>{
    if(FILTER!=='alle'&&zustand(s.id)!==FILTER) return false;
    if(!q) return true;
    const c=(s.punkte||[]).map(code).join(' ');
    return (s.name+' '+(s.linie||'')+' '+c).toLowerCase().includes(q);
  });
  const rang={abgelaufen:0,warnung:1,ausbildung:2,gueltig:3,keine:4};
  liste.sort((a,b)=>rang[zustand(a.id)]-rang[zustand(b.id)]||a.name.localeCompare(b.name,'de'));
  const f=[['alle','Alle'],['gueltig','Gültig'],['warnung','Läuft ab'],['abgelaufen','Abgelaufen'],['ausbildung','Ausbildung'],['keine','Keine']];
  return `
  <input class="suche" id="suchfeld" placeholder="Strecke, Linie oder Betriebspunkt suchen" value="${esc(SUCHE)}">
  <div class="chips">${f.map(([k,t])=>`<button class="chip ${FILTER===k?'an':''}" data-tat="filter" data-wert="${k}">${k!=='alle'?`<span class="lampe ${k} klein"></span>`:''}${t}</button>`).join('')}</div>
  <button class="btn haupt voll" data-tat="strecke-neu" style="margin-bottom:12px">Strecke erfassen</button>
  ${liste.length?liste.map(streckeKarte).join(''):`<div class="leer"><b>Keine Treffer</b>Suche oder Filter anpassen.</div>`}`;
}

function ansichtPunkte(){
  const q=SUCHE.toLowerCase();
  const liste=S.punkte.filter(p=>(p.abk+' '+p.name+' '+(p.bahn||'')).toLowerCase().includes(q))
    .sort((a,b)=>a.name.localeCompare(b.name,'de'));
  const anz=p=>S.strecken.filter(s=>(s.punkte||[]).includes(p.id)).length;

function ansichtTeam(){

  const q=SUCHE.toLowerCase();
  const zaehlen=zeilen=>{ const z={gueltig:0,warnung:0,abgelaufen:0,ausbildung:0};
    zeilen.forEach(r=>{ if(z[r.zustand]!==undefined) z[r.zustand]++; }); return z; };
  const ampel=z=>`<span class="ampel">
    <span><span class="lampe gueltig klein"></span>${z.gueltig}</span>
    <span><span class="lampe warnung klein"></span>${z.warnung}</span>
    <span><span class="lampe abgelaufen klein"></span>${z.abgelaufen}</span></span>`;

    inhalt=leute.length?`<div class="liste">${leute.map(p=>{
      const z=zaehlen(S.teamStand.filter(r=>r.benutzer_id===p.id));

/* ============================================================
   Aktionen
   ============================================================ */
const TATEN = {
  'tormodus': e=>{ TORMODUS=e.dataset.wert; zeichnen(); },
  'anmelden': async ()=>{
    const {error}=await db.auth.signInWithPassword({ email:$('a-mail').value.trim(), password:$('a-pw').value });
    if(error) fehler(error);
  },
  'registrieren': async ()=>{
    const mail=$('a-mail').value.trim(), pw=$('a-pw').value;
    if(!mail||pw.length<8){ meldung('E-Mail und Passwort mit mindestens 8 Zeichen angeben', true); return; }
    const {data,error}=await db.auth.signUp({ email:mail, password:pw, options:{ data:{
      name:$('a-name').value.trim(), personalnummer:$('a-pnr').value.trim(), depot:$('a-depot').value.trim() }}});
    if(error){ fehler(error); return; }
    if(!data.session) meldung('Konto erstellt — bitte E-Mail bestätigen, dann anmelden');
  },
  'abmelden': async ()=>{ await db.auth.signOut(); },

  'nav': e=>{ ANSICHT=e.dataset.wert; SUCHE=''; FILTER='alle'; zeichnen(); window.scrollTo(0,0); },
  'filter': e=>{ FILTER=e.dataset.wert; zeichnen(); },
  'teammodus': e=>{ TEAMMODUS=e.dataset.wert; SUCHE=''; zeichnen(); },
  'blatt-zu': blattZu,

  'strecke-neu': ()=>formularStrecke(null),
  'strecke-bearbeiten': e=>formularStrecke(e.dataset.id),
  'bp-weg': e=>{ ENTWURF.punkte.splice(+e.dataset.i,1); zeichneBpWahl(); },
  'strecke-sichern': async ()=>{
    const name=$('f-name').value.trim();
    if(!name){ meldung('Bezeichnung fehlt', true); return; }
    const werte={ name, linie:$('f-linie').value.trim(), km:$('f-km').value.trim(),
      zugsicherung:$('f-zs').value.trim(), notiz:$('f-notiz').value.trim() };
    let sid=ENTWURF.id;
    if(sid){ const {error}=await db.from('strecke').update(werte).eq('id',sid); if(error) return fehler(error); }
    else { const {data,error}=await db.from('strecke').insert(werte).select().single(); if(error) return fehler(error); sid=data.id; }
    await db.from('strecke_punkt').delete().eq('strecke_id',sid);
    if(ENTWURF.punkte.length){
      const {error}=await db.from('strecke_punkt').insert(ENTWURF.punkte.map((pid,i)=>({strecke_id:sid,punkt_id:pid,reihenfolge:i})));
      if(error) return fehler(error);
    }
    blattZu(); await alleLaden(); zeichnen(); meldung('Strecke gesichert');
  },
  'strecke-loeschen': async e=>{
    if(!confirm('Strecke samt aller Kenntnis- und Fahrteinträge löschen?')) return;
    const {error}=await db.from('strecke').delete().eq('id',e.dataset.id);
    if(error) return fehler(error);
    blattZu(); await alleLaden(); zeichnen();
  },

  'kenntnis-bearbeiten': e=>formularKenntnis(e.dataset.id),
  'kenntnis-sichern': async e=>{
    const werte={ benutzer_id:S.user.id, strecke_id:e.dataset.id, status:$('k-status').value,
      erwerb:$('k-erwerb').value||null, letzte_befahrung:$('k-letzte').value||null,
      notiz:$('k-notiz').value.trim(), aktualisiert:new Date().toISOString() };
    const {error}=await db.from('kenntnis').upsert(werte,{onConflict:'benutzer_id,strecke_id'});
    if(error) return fehler(error);
    blattZu(); await alleLaden(); zeichnen(); meldung('Kenntnis gesichert');
  },
  'gefahren': async e=>{
    const sid=e.dataset.id;
    const {error}=await db.from('fahrt').insert({ benutzer_id:S.user.id, strecke_id:sid, datum:heute(),
      richtung:'hin', notiz:'Schnelleintrag' });
    if(error) return fehler(error);
    if(meineKenntnis(sid).status!=='vorhanden'){
      await db.from('kenntnis').upsert({ benutzer_id:S.user.id, strecke_id:sid, status:'vorhanden',
        aktualisiert:new Date().toISOString() },{onConflict:'benutzer_id,strecke_id'});
    }
    await alleLaden(); zeichnen(); meldung('Fahrt eingetragen — Frist läuft neu');
  },

  'punkt-neu': ()=>formularPunkt(null),
  'punkt-bearbeiten': e=>formularPunkt(e.dataset.id),
  'punkt-sichern': async ()=>{
    const abk=$('p-abk').value.trim().toUpperCase(), name=$('p-name').value.trim();
    if(!abk||!name){ meldung('Abkürzung und Name werden benötigt', true); return; }
    const werte={ abk, name, typ:$('p-typ').value, bahn:$('p-bahn').value.trim(), notiz:$('p-notiz').value.trim() };
    const {error}=ENTWURF.id
      ? await db.from('betriebspunkt').update(werte).eq('id',ENTWURF.id)
      : await db.from('betriebspunkt').insert(werte);
    if(error) return fehler(error);
    blattZu(); await alleLaden(); zeichnen(); meldung('Betriebspunkt gesichert');
  },
  'punkt-loeschen': async e=>{
    const n=S.strecken.filter(s=>(s.punkte||[]).includes(e.dataset.id)).length;
    if(!confirm(n?`Der Punkt ist in ${n} Strecke(n) eingetragen und wird dort entfernt. Löschen?`:'Betriebspunkt löschen?')) return;
    const {error}=await db.from('betriebspunkt').delete().eq('id',e.dataset.id);
    if(error) return fehler(error);
    blattZu(); await alleLaden(); zeichnen();
  },

  'fahrt-neu': formularFahrt,
  'fahrt-sichern': async ()=>{
    const {error}=await db.from('fahrt').insert({ benutzer_id:S.user.id, strecke_id:$('d-strecke').value,
      datum:$('d-datum').value||heute(), richtung:$('d-richtung').value, zug:$('d-zug').value.trim(),
      fahrzeug:$('d-fahrzeug').value.trim(), notiz:$('d-notiz').value.trim() });
    if(error) return fehler(error);
    blattZu(); await alleLaden(); zeichnen(); meldung('Fahrt eingetragen');
  },
  'fahrt-loeschen': async e=>{
    const {error}=await db.from('fahrt').delete().eq('id',e.dataset.id);
    if(error) return fehler(error);
    await alleLaden(); zeichnen();
  },

  'profil-sichern': async ()=>{
    const werte={ name:$('k-name').value.trim(), personalnummer:$('k-pnr').value.trim(), depot:$('k-depot').value.trim() };
    const {error}=await db.from('profil').update(werte).eq('id',S.user.id);
    if(error) return fehler(error);
    Object.assign(S.profil,werte); zeichnen(); meldung('Angaben gesichert');
  },
  'konfig-sichern': async ()=>{
    const werte={ gueltig_monate:Math.max(1,Math.min(60,+$('e-monate').value||12)),
      warn_tage:Math.max(1,Math.min(365,+$('e-warn').value||60)), aktualisiert:new Date().toISOString() };
    const {error}=await db.from('konfiguration').update(werte).eq('id',1);
    if(error) return fehler(error);
    Object.assign(S.konfig,werte); await teamLaden(); zeichnen(); meldung('Fristenregel übernommen');
  },
  'rolle-tauschen': async e=>{
    const neu=e.dataset.wert;
    if(!confirm(neu==='admin'?'Diesem Konto Administratorrechte geben?':'Administratorrechte entziehen?')) return;
    const {error}=await db.from('profil').update({rolle:neu}).eq('id',e.dataset.id);
    if(error) return fehler(error);
    await teamLaden(); zeichnen(); meldung('Rolle geändert');
  },

  'team-neu-laden': async ()=>{ await teamLaden(); zeichnen(); meldung('Auswertung aktualisiert'); },
  'team-person': e=>{
    const p=S.teamProfile.find(x=>x.id===e.dataset.id); if(!p) return;
    const zeilen=S.teamStand.filter(r=>r.benutzer_id===p.id)
      .sort((a,b)=>(a.ablauf||'9999').localeCompare(b.ablauf||'9999'));
    blattOeffnen(p.name||'Konto',()=>zeilen.length?`<div class="liste">${zeilen.map(r=>`
      <div class="punkt"><span class="lampe ${r.zustand}"></span>
      <span class="txt"><span class="n">${esc(r.strecke_name)}</span>
      <span class="m">${ZTEXT[r.zustand]||r.zustand}${r.ablauf?' · bis '+datum(r.ablauf):''}${r.letzte_befahrung?' · zuletzt '+datum(r.letzte_befahrung):''}</span></span></div>`).join('')}</div>`
      :`<div class="leer">Für dieses Konto ist noch keine Kenntnis erfasst.</div>`);
  },
  'team-strecke': e=>{
    const s=S.strecken.find(x=>x.id===e.dataset.id); if(!s) return;
    const zeilen=S.teamStand.filter(r=>r.strecke_id===s.id)
      .sort((a,b)=>String(a.benutzer_name).localeCompare(String(b.benutzer_name),'de'));
    blattOeffnen(s.name,()=>zeilen.length?`<div class="liste">${zeilen.map(r=>`
      <div class="punkt"><span class="lampe ${r.zustand}"></span>
      <span class="txt"><span class="n">${esc(r.benutzer_name||'Ohne Namen')}</span>
      <span class="m">${ZTEXT[r.zustand]||r.zustand}${r.ablauf?' · bis '+datum(r.ablauf):''}${r.depot?' · '+esc(r.depot):''}</span></span></div>`).join('')}</div>`
      :`<div class="leer">Niemand hat für diese Strecke eine Kenntnis erfasst.</div>`);
  },
  'team-csv': ()=>{
    const z=[['Mitarbeiter','Personalnummer','Depot','Strecke','Linie','Status','Erworben','Letzte Befahrung','Gültig bis','Tage']];
    S.teamStand.forEach(r=>z.push([r.benutzer_name,r.personalnummer,r.depot,r.strecke_name,r.linie,
      ZTEXT[r.zustand]||r.zustand,datum(r.erwerb),datum(r.letzte_befahrung),datum(r.ablauf),r.tage_rest ?? '']));
    textBlatt('Auswertung als CSV', z.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n'));
  },
  'kopieren': async ()=>{
    const f=$('t-feld');
    try{ await navigator.clipboard.writeText(f.value); meldung('kopiert'); }
    catch(err){ f.select(); meldung('Text ist markiert — mit Kopieren übernehmen'); }
  },
  'beispiel': async ()=>{ await beispieldaten(); await alleLaden(); zeichnen(); }
};

/* ---------- Beispieldaten ---------- */
async function beispieldaten(){
  const bp=[['BS','Basel SBB'],['OL','Olten'],['AA','Aarau'],['BG','Brugg AG'],['BAD','Baden'],
    ['ZUE','Zürich HB'],['W','Winterthur'],['SH','Schaffhausen'],['SG','St. Gallen'],['RH','Romanshorn'],
    ['ZG','Zug'],['LZ','Luzern'],['AG','Arth-Goldau'],['BEL','Bellinzona'],['LUG','Lugano'],
    ['CH','Chur'],['SAR','Sargans'],['ZB','Ziegelbrücke'],['BN','Bern'],['TH','Thun'],
    ['SP','Spiez'],['IO','Interlaken Ost'],['BR','Brig'],['VS','Visp'],['FR','Fribourg'],
    ['LS','Lausanne'],['GE','Genève'],['MG','Martigny'],['SIO','Sion'],['BI','Biel/Bienne'],
    ['NE','Neuchâtel'],['SO','Solothurn'],['BD','Burgdorf'],['LT','Langenthal'],['DE','Delémont'],['YV','Yverdon-les-Bains']];
  const neu=bp.filter(([abk])=>!S.punkte.some(p=>p.abk===abk))
    .map(([abk,name])=>({abk,name,typ:'Bahnhof',bahn:'SBB'}));
  if(neu.length){ const {error}=await db.from('betriebspunkt').insert(neu); if(error) return fehler(error); }

  const {data:alle}=await db.from('betriebspunkt').select('id,abk');
  const karte={}; (alle||[]).forEach(p=>karte[p.abk]=p.id);

  const str=[['Basel SBB – Olten (Hauenstein-Basislinie)','500','40',['BS','OL']],
    ['Olten – Bern','450','62',['OL','LT','BD','BN']],
    ['Olten – Zürich HB','650','65',['OL','AA','BG','BAD','ZUE']],
    ['Bern – Brig (Lötschberg)','300','116',['BN','TH','SP','BR']],
    ['Zürich HB – Chur','900','120',['ZUE','ZB','SAR','CH']],
    ['Zürich HB – St. Gallen','850','86',['ZUE','W','SG']],
    ['Luzern – Bellinzona (Gotthard-Bergstrecke)','600','160',['LZ','AG','BEL']],
    ['Lausanne – Brig (Simplonlinie)','100','150',['LS','MG','SIO','VS','BR']]];
  for(const [name,linie,km,codes] of str){
    if(S.strecken.some(s=>s.name===name)) continue;
    const {data,error}=await db.from('strecke').insert({name,linie,km}).select().single();
    if(error){ fehler(error); continue; }
    await db.from('strecke_punkt').insert(codes.map((c,i)=>({strecke_id:data.id,punkt_id:karte[c],reihenfolge:i})));
  }
  meldung('Beispieldaten geladen — Abkürzungen prüfen');
}

   Rahmen
   ============================================================ */
const TABS=[
  ['uebersicht','Übersicht','<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>'],
  ['strecken','Strecken','<path d="M4 18h16"/><path d="M4 6h16"/><path d="M9 6v12"/><path d="M15 6v12"/>'],
  ['punkte','Punkte','<circle cx="7" cy="12" r="2.4"/><circle cx="17" cy="12" r="2.4"/><path d="M9.4 12h5.2"/>'],
  ['fahrten','Fahrten','<rect x="5" y="4" width="14" height="12" rx="2"/><path d="M5 12h14"/><path d="M8 20l1.5-4M16 20l-1.5-4"/>'],
  ['team','Team','<circle cx="9" cy="8" r="3"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17" cy="9" r="2.2"/><path d="M15 14.5c2.6-.6 5 1 5 4.5"/>'],
  ['konto','Konto','<circle cx="12" cy="8.5" r="3.2"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/>']
];

function zeichnen(){
  const angemeldet = !!(S.user && S.profil);
  document.body.classList.toggle('angemeldet', angemeldet);
  $('kopf').hidden = !angemeldet;
  $('navigation').hidden = !angemeldet;

  if(!angemeldet){ $('ansicht').innerHTML=ansichtTor(); return; }

  if(ANSICHT==='team' && !istAdmin()) ANSICHT='uebersicht';
  $('kennung').innerHTML = `${esc(S.profil.name||S.user.email)} <span class="rollenschild ${istAdmin()?'admin':''}">${istAdmin()?'ADMIN':'LF'}</span>`;

  const seiten={uebersicht:ansichtUebersicht,strecken:ansichtStrecken,punkte:ansichtPunkte,
    fahrten:ansichtFahrten,team:ansichtTeam,konto:ansichtKonto};
  $('ansicht').innerHTML=seiten[ANSICHT]();

  $('navigation').innerHTML=TABS.filter(([k])=>k!=='team'||istAdmin())
    .map(([k,t,ik])=>`<button class="${ANSICHT===k?'an':''}" data-tat="nav" data-wert="${k}"><svg viewBox="0 0 24 24">${ik}</svg>${t}</button>`).join('');

  const f=$('suchfeld');
  if(f) f.addEventListener('input',()=>{
    SUCHE=f.value; const pos=f.selectionStart; zeichnen();
    const n=$('suchfeld'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  });
}

document.addEventListener('click',ev=>{
  const ziel=ev.target.closest('[data-tat]'); if(!ziel) return;
  const tat=TATEN[ziel.dataset.tat];
  if(tat){ ev.preventDefault(); tat(ziel); }
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='f-bpwahl'&&ev.target.value&&ENTWURF){
    ENTWURF.punkte.push(ev.target.value); ev.target.value=''; zeichneBpWahl();
  }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Escape'&&!$('hintergrund').hidden) blattZu(); });
$('hintergrund').addEventListener('click',ev=>{ if(ev.target===$('hintergrund')) blattZu(); });

async function sitzungWechsel(session){
  if(session && session.user){
    S.user=session.user;
    const {data,error}=await db.from('profil').select('*').eq('id',S.user.id).maybeSingle();
    if(error){ fehler(error); return; }
    if(!data){
      const {data:neu,error:e2}=await db.from('profil').insert({id:S.user.id,name:S.user.email}).select().single();
      if(e2){ fehler(e2); return; }
      S.profil=neu;
    } else S.profil=data;
    await alleLaden();
    ANSICHT='uebersicht';
  } else { S.user=null; S.profil=null; }
  zeichnen();
}

db.auth.onAuthStateChange((_e,session)=>{ sitzungWechsel(session); });
(async ()=>{ const {data}=await db.auth.getSession(); await sitzungWechsel(data.session); })();
</script>

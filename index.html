<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swiss Rail Connections — Kenntnisregister</title>
<link rel="icon" type="image/png" href="logo-marke.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --graphit:#14181b; --panel:#1d2327; --panel2:#232b30; --linie:#303b41;
  --kreide:#e8edef; --stahl:#8a9aa3;
  --fahrt:#2fbf71; --warnung:#f2b705; --halt:#e23d28; --lernen:#4da3ff;
  --ui:'Barlow Semi Condensed',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--graphit);color:var(--kreide);font-family:var(--ui);font-size:17px;line-height:1.35}
body.angemeldet{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

header{position:sticky;top:0;z-index:30;background:var(--graphit);border-bottom:1px solid var(--linie);
  padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top))}
header[hidden]{display:none}
.marke{display:flex;align-items:baseline;gap:10px}
.marke h1{font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.logo-kopf{height:27px;width:auto;display:block;flex:0 0 auto}
.tor .logo-bild{width:100%;max-width:290px;height:auto;display:block;margin:0 0 18px}
.marke .kennung{font-family:var(--mono);font-size:11px;color:var(--stahl);letter-spacing:.1em;margin-left:auto;white-space:nowrap}
.statuszeile{font-family:var(--mono);font-size:11px;color:var(--stahl);margin-top:4px;min-height:14px;letter-spacing:.05em}
.statuszeile.fehler{color:var(--halt)}

main{padding:16px 16px 24px;max-width:820px;margin:0 auto}
.abschnitt{margin-bottom:26px}
.abschnitt>h2{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--stahl);
  font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}

.lampe{width:14px;height:14px;border-radius:50%;flex:0 0 auto;background:#39454b}
.lampe.gueltig{background:var(--fahrt);box-shadow:0 0 10px rgba(47,191,113,.55)}
.lampe.warnung{background:var(--warnung);box-shadow:0 0 10px rgba(242,183,5,.5)}
.lampe.abgelaufen{background:var(--halt);box-shadow:0 0 10px rgba(226,61,40,.55);animation:puls 2.4s ease-in-out infinite}
.lampe.ausbildung{background:var(--lernen);box-shadow:0 0 10px rgba(77,163,255,.45)}
.lampe.klein{width:9px;height:9px;box-shadow:none}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){.lampe.abgelaufen{animation:none}}

.kacheln{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kachel{background:var(--panel);border:1px solid var(--linie);border-radius:3px;padding:12px}
.kachel .zahl{font-family:var(--mono);font-size:30px;font-weight:600;line-height:1}
.kachel .bez{font-size:13px;color:var(--stahl);margin-top:6px;display:flex;align-items:center;gap:7px;
  text-transform:uppercase;letter-spacing:.08em}

.karte{background:var(--panel);border:1px solid var(--linie);border-radius:3px;padding:12px 13px;margin-bottom:8px}
.kopfzeile{display:flex;align-items:center;gap:10px}
.kopfzeile .titel{flex:1;min-width:0;font-size:18px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linienr{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;background:var(--panel2);
  border:1px solid var(--linie);border-radius:2px;padding:2px 6px;color:var(--stahl)}
.frist{font-family:var(--mono);font-size:12px;color:var(--stahl);margin-top:6px}
.frist b{font-weight:600;color:var(--kreide)}
.frist.rot b{color:var(--halt)} .frist.gelb b{color:var(--warnung)}
.meta{font-size:13px;color:var(--stahl);margin-top:8px}

.band{display:flex;align-items:center;margin:11px 0 3px;overflow:hidden}
.band .bp{display:flex;align-items:center;flex:0 0 auto}
.band .knoten{width:7px;height:7px;border-radius:50%;background:var(--stahl)}
.band .knoten.rand{width:9px;height:9px;background:var(--kreide)}
.band .schiene{height:1px;background:var(--linie);flex:1 1 auto;min-width:10px}
.band .code{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--stahl);padding:0 5px;white-space:nowrap}
.band .code.rand{color:var(--kreide);font-weight:600}
.band .rest{font-family:var(--mono);font-size:11px;color:#5f6d75;padding:0 5px}

.gleisfeld{display:flex;flex-direction:column;gap:3px;margin:11px 0 3px}
.gleisfeld i{display:block;height:2px;background:var(--linie);border-radius:1px}

.balken{height:3px;background:#2a3238;border-radius:2px;overflow:hidden;margin-top:9px}
.balken i{display:block;height:100%}

.aktionen{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btn{border:1px solid var(--linie);background:var(--panel2);border-radius:2px;padding:8px 12px;
  font-size:14px;font-weight:500;color:var(--kreide)}
.btn:active{background:#2b353b}
.btn.haupt{background:var(--kreide);color:var(--graphit);border-color:var(--kreide);font-weight:600}
.btn.gefahr{color:var(--halt);border-color:#4a2b26}
.btn.voll{width:100%;text-align:center}
.btn.klein{padding:5px 9px;font-size:13px}

.suche{width:100%;background:var(--panel);border:1px solid var(--linie);border-radius:2px;padding:11px 12px;margin-bottom:9px;outline:none}
.suche:focus{border-color:#4a5960}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--linie);background:transparent;border-radius:2px;padding:6px 10px;
  font-size:13px;color:var(--stahl);display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.07em}
.chip.an{background:var(--panel2);color:var(--kreide);border-color:#4a5960}

.liste{background:var(--panel);border:1px solid var(--linie);border-radius:3px;overflow:hidden}
.punkt{display:flex;align-items:center;gap:11px;padding:11px 13px;border-bottom:1px solid var(--linie)}
.punkt:last-child{border-bottom:none}
.punkt .abk{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.09em;background:var(--panel2);
  border:1px solid var(--linie);border-radius:2px;padding:5px 7px;min-width:52px;text-align:center}
.punkt .txt{flex:1;min-width:0}
.punkt .txt .n{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.punkt .txt .m{display:block;font-size:12px;color:var(--stahl)}
.ampel{display:flex;gap:5px;align-items:center;font-family:var(--mono);font-size:12px;color:var(--stahl)}
.ampel span{display:flex;align-items:center;gap:3px}

.leer{border:1px dashed var(--linie);border-radius:3px;padding:22px 16px;text-align:center;color:var(--stahl);font-size:15px}
.leer b{display:block;color:var(--kreide);font-weight:600;font-size:17px;margin-bottom:5px}

label{display:block;margin-bottom:12px}
label span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--stahl);margin-bottom:5px;font-weight:600}
input,select,textarea{width:100%;background:var(--graphit);border:1px solid var(--linie);border-radius:2px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#5b6b73}
textarea{resize:vertical;min-height:64px;font-size:15px}
.zweispaltig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hinweis{font-size:13px;color:var(--stahl);margin:-6px 0 12px}

.hintergrund{position:fixed;inset:0;background:rgba(8,10,12,.72);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.hintergrund[hidden]{display:none}
.blatt{background:var(--panel);border:1px solid var(--linie);border-bottom:none;border-radius:6px 6px 0 0;
  width:100%;max-width:820px;max-height:92vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.blatt h3{font-size:19px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.blatt h3 button{font-family:var(--mono);font-size:13px;color:var(--stahl);white-space:nowrap}

.bpwahl{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;min-height:34px}
.bptag{font-family:var(--mono);font-size:12px;letter-spacing:.07em;background:var(--panel2);border:1px solid var(--linie);
  border-radius:2px;padding:6px 8px;display:flex;align-items:center;gap:7px}
.bptag button{color:var(--stahl);font-size:15px;line-height:1}
.bpwahl .platzhalter{color:var(--stahl);font-size:14px}

nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;background:var(--panel);
  border-top:1px solid var(--linie);padding-bottom:env(safe-area-inset-bottom)}
nav[hidden]{display:none}
nav button{flex:1;padding:9px 1px 10px;font-size:9px;text-transform:uppercase;letter-spacing:.02em;color:var(--stahl);
  display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:600;border-top:2px solid transparent;margin-top:-1px}
nav button.an{color:var(--kreide);border-top-color:var(--kreide)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

.tor{max-width:420px;margin:0 auto;padding:56px 20px 40px}
.tor .logo{font-family:var(--mono);font-size:11px;letter-spacing:.22em;color:var(--stahl);margin-bottom:8px}
.tor h1{font-size:30px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.tor .unter{color:var(--stahl);font-size:15px;margin-bottom:26px;line-height:1.45}
.wechsel{display:flex;border:1px solid var(--linie);border-radius:2px;margin-bottom:20px;overflow:hidden}
.wechsel button{flex:1;padding:10px;font-size:14px;font-weight:600;color:var(--stahl);letter-spacing:.05em}
.wechsel button.an{background:var(--panel2);color:var(--kreide)}
.gleis{height:1px;background:var(--linie);position:relative;margin:30px 0}
.gleis::before,.gleis::after{content:'';position:absolute;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--linie)}
.gleis::before{left:0} .gleis::after{right:0}

.rollenschild{font-family:var(--mono);font-size:10px;letter-spacing:.12em;border:1px solid var(--linie);
  border-radius:2px;padding:3px 6px;color:var(--stahl)}
.rollenschild.admin{color:var(--warnung);border-color:#4d411a}
.kartenbox{height:64vh;min-height:340px;border:1px solid var(--linie);border-radius:3px;overflow:hidden;background:#0f1214}
.leaflet-container{background:#0f1214;font-family:var(--ui)}
.leaflet-control-attribution{background:rgba(20,24,27,.82)!important;color:#7d8b93!important;font-size:9px}
.leaflet-control-attribution a{color:#9fb0b8!important}
.leaflet-bar a,.leaflet-control-layers{background:var(--panel)!important;color:var(--kreide)!important;border-color:var(--linie)!important}
.leaflet-bar a{border-bottom-color:var(--linie)!important}
.leaflet-control-layers-expanded{color:var(--kreide);padding:8px 10px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--kreide);border-radius:3px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.leaflet-popup-content{margin:11px 13px;font-size:15px;line-height:1.35}
.leaflet-popup-content b{display:block;font-size:17px;margin-bottom:2px}
.leaflet-popup-content .pm{font-family:var(--mono);font-size:11px;color:var(--stahl);letter-spacing:.06em}
.leaflet-container a.leaflet-popup-close-button{color:var(--stahl)}
.streckenschild{background:rgba(20,24,27,.94)!important;border:1px solid var(--linie)!important;
  border-radius:2px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  padding:3px 7px!important;box-shadow:0 2px 8px rgba(0,0,0,.6)!important;white-space:nowrap}
.streckenschild::before{display:none!important}
.ss-art{color:#8a9aa3;font-weight:400;text-transform:uppercase;letter-spacing:.12em;font-size:9px}
.ss-nr{color:#ffb347;font-weight:600;font-size:12px}
.ss-tab{color:#7fd4ff;font-weight:500}
.ss-strich{color:#4a5960}
.vorschlaege{border:1px solid var(--linie);border-radius:2px;margin:-6px 0 12px;max-height:230px;overflow-y:auto;background:var(--graphit)}
.vorschlaege[hidden]{display:none}
.vorschlag{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--linie);width:100%;text-align:left}
.vorschlag:last-child{border-bottom:none}
.vorschlag:active{background:var(--panel2)}
.vorschlag .vk{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em;background:var(--panel2);
  border:1px solid var(--linie);border-radius:2px;padding:4px 6px;min-width:48px;text-align:center;color:var(--kreide)}
.vorschlag .vn{flex:1;min-width:0;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vorschlag .vq{font-size:10px;color:var(--stahl);text-transform:uppercase;letter-spacing:.1em;white-space:nowrap}
.legende{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:12px;color:var(--stahl)}
.legende span{display:flex;align-items:center;gap:5px}
.hinweisbalken{background:var(--panel2);border:1px solid var(--linie);border-left:2px solid var(--lernen);
  border-radius:2px;padding:10px 12px;font-size:14px;margin-bottom:9px}
.fussnote{font-size:12px;color:var(--stahl);line-height:1.5}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--lernen);outline-offset:2px}
</style>
</head>
<body>

<header id="kopf" hidden>
  <div class="marke">
    <img src="logo.png" alt="Swiss Rail Connections" class="logo-kopf"
         onerror="this.remove();var t=document.getElementById('marke-text');if(t)t.hidden=false">
    <h1 id="marke-text" hidden>Swiss Rail Connections</h1>
    <span class="kennung" id="kennung"></span>
  </div>
  <div class="statuszeile" id="statuszeile"></div>
</header>

<main id="ansicht"></main>
<nav id="navigation" hidden></nav>

<div class="hintergrund" id="hintergrund" hidden><div class="blatt" id="blatt"></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js"></script>
<script>
/* ============================================================
   ZUGANGSDATEN — Supabase Dashboard, Settings > API Keys / Data API
   ============================================================ */
const SUPABASE_URL      = 'https://rjydrpkxzkacnbblkyzf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_bII4ZamzpUBFq_6EKsGMZA_mxrTD9mS';
/* ========================================================== */

let db = null;
function startfehler(text){
  document.body.innerHTML = `<div class="tor"><div class="logo">START NICHT MÖGLICH</div>
    <h1>App nicht bereit</h1><div class="unter">${text}</div></div>`;
}
function fehlerAnzeigen(text){
  const z=document.querySelector('#torstatus')||document.querySelector('#statuszeile');
  if(z){ z.textContent=text||'Unbekannter Fehler'; z.className='statuszeile fehler'; }
}
window.addEventListener('error', ev=>fehlerAnzeigen(ev.message));
window.addEventListener('unhandledrejection', ev=>{
  const g=ev.reason;
  if(g && g.name==='AbortError') return;
  fehlerAnzeigen(g && g.message ? g.message : String(g));
});
try{
  if(!window.supabase || !window.supabase.createClient)
    throw new Error('Die Supabase-Bibliothek wurde nicht geladen. Internetverbindung prüfen; im Firmennetz ist cdn.jsdelivr.net eventuell gesperrt.');
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(SUPABASE_URL))
    throw new Error('Die Projekt-URL ist ungültig. Sie muss so aussehen: https://projektkennung.supabase.co — ohne /rest/v1/ am Ende.');
  db = window.supabase.createClient(SUPABASE_URL.replace(/\/+$/,''), SUPABASE_ANON_KEY);
}catch(e){ startfehler(e.message); }

let S = {
  user:null, profil:null,
  konfig:{ gueltig_monate:12, warn_tage:60 },
  punkte:[], strecken:[],
  kS:{}, kA:{},
  fahrten:[], einsaetze:[],
  teamProfile:[], teamStand:[]
};
let ANSICHT='uebersicht', SUCHE='', FILTER='alle', JOURNAL='fahrten',
    TEAMMODUS='mitarbeiter', ENTWURF=null, TORMODUS='anmelden';
let STRECKE_ZURUECK=null;
let KARTE=null, KARTENSICHT={center:[46.82,8.23], zoom:8},
    KARTENMODUS='ansehen', KARTENZIEL='', VERLAUF=[], KARTENPERSON='';

/* ---------- Werkzeuge ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const istAdmin = () => S.profil && S.profil.rolle === 'admin';
const FUNKTION = { lokfuehrer:'Lokführer', rangierleiter:'Rangierleiter', beides:'Lokführer und Rangierleiter' };
const FKURZ    = { lokfuehrer:'LF', rangierleiter:'RL', beides:'LF·RL' };
const fkt = p => (p && p.funktion) || 'lokfuehrer';

function heute(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function monateDazu(iso,m){ const d=new Date(iso+'T00:00:00'); const t=d.getDate(); d.setMonth(d.getMonth()+m);
  if(d.getDate()<t) d.setDate(0); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function tageBis(iso){ return Math.round((new Date(iso+'T00:00:00')-new Date(heute()+'T00:00:00'))/864e5); }
function datum(iso){ if(!iso) return '—'; const [j,m,t]=String(iso).slice(0,10).split('-'); return `${t}.${m}.${j}`; }

function meldung(text, fehlerhaft){
  const z = document.querySelector('#torstatus') || $('statuszeile');
  if(!z) return;
  z.textContent=text; z.className='statuszeile'+(fehlerhaft?' fehler':'');
  clearTimeout(meldung._t); meldung._t=setTimeout(()=>{ z.textContent=''; }, fehlerhaft?9000:2600);
}
function fehler(e){ meldung(e && e.message ? e.message : String(e), true); }

/* ============================================================
   Fachlogik — für Strecken und Anlagen identisch
   ============================================================ */
const LEER = { status:'keine', erwerb:null, letzte:null, notiz:'' };
function kenntnisS(id){ const k=S.kS[id]; return k?{...k,letzte:k.letzte_befahrung}:LEER; }
function kenntnisA(id){ const k=S.kA[id]; return k?{...k,letzte:k.letzte_taetigkeit}:LEER; }

function letztesDatum(eintraege, feld, id){
  let d=''; eintraege.forEach(e=>{ if(e[feld]===id && e.datum>d) d=e.datum; }); return d;
}
function fristVon(k, journalDatum){
  if(k.status!=='vorhanden') return '';
  const kandidaten=[k.erwerb||'', k.letzte||'', journalDatum||''].filter(Boolean).sort();
  const basis=kandidaten[kandidaten.length-1];
  return basis ? monateDazu(basis, S.konfig.gueltig_monate) : '';
}
function zustandVon(k, ablaufDatum){
  if(k.status==='keine') return 'keine';
  if(k.status==='ausbildung') return 'ausbildung';
  if(!ablaufDatum) return 'gueltig';
  const t=tageBis(ablaufDatum);
  if(t<0) return 'abgelaufen';
  if(t<=S.konfig.warn_tage) return 'warnung';
  return 'gueltig';
}
const ablaufS  = sid => fristVon(kenntnisS(sid), letztesDatum(S.fahrten,'strecke_id',sid));
const zustandS = sid => zustandVon(kenntnisS(sid), ablaufS(sid));
const ablaufA  = pid => fristVon(kenntnisA(pid), letztesDatum(S.einsaetze,'punkt_id',pid));
const zustandA = pid => zustandVon(kenntnisA(pid), ablaufA(pid));

const ZTEXT={gueltig:'Kenntnis gültig',warnung:'Läuft bald ab',abgelaufen:'Abgelaufen',ausbildung:'In Ausbildung',keine:'Keine Kenntnis'};
const ZFARBE={gueltig:'var(--fahrt)',warnung:'var(--warnung)',abgelaufen:'var(--halt)',ausbildung:'var(--lernen)',keine:'#39454b'};
const ZHEX={gueltig:'#2fbf71',warnung:'#f2b705',abgelaufen:'#e23d28',ausbildung:'#4da3ff',keine:'#6b7a82'};

function punkt(id){ return S.punkte.find(p=>p.id===id); }
function code(id){ const p=punkt(id); return p?p.abk:'??'; }

/* ---------- Daten laden ---------- */
async function alleLaden(){
  const [kf,bp,st,sp,ke,an,fa,ei] = await Promise.all([
    db.from('konfiguration').select('*').eq('id',1).maybeSingle(),
    db.from('betriebspunkt').select('*'),
    db.from('strecke').select('*'),
    db.from('strecke_punkt').select('*').order('reihenfolge'),
    db.from('kenntnis').select('*').eq('benutzer_id', S.user.id),
    db.from('anlagenkenntnis').select('*').eq('benutzer_id', S.user.id),
    db.from('fahrt').select('*').eq('benutzer_id', S.user.id).order('datum',{ascending:false}).limit(400),
    db.from('einsatz').select('*').eq('benutzer_id', S.user.id).order('datum',{ascending:false}).limit(400)
  ]);
  const err=[kf,bp,st,sp,ke,an,fa,ei].find(r=>r.error);
  if(err){ fehler(err.error); return; }

  if(kf.data) S.konfig=kf.data;
  S.punkte=bp.data||[];
  const zu={}; (sp.data||[]).forEach(r=>{ (zu[r.strecke_id] = zu[r.strecke_id] || []).push(r.punkt_id); });
  S.strecken=(st.data||[]).map(s=>({ ...s, punkte: zu[s.id]||[] }));
  S.kS={}; (ke.data||[]).forEach(k=>{ S.kS[k.strecke_id]=k; });
  S.kA={}; (an.data||[]).forEach(k=>{ S.kA[k.punkt_id]=k; });
  S.fahrten=fa.data||[]; S.einsaetze=ei.data||[];

  if(istAdmin()) await teamLaden();
}
async function teamLaden(){
  const [pr,vs,va]=await Promise.all([
    db.from('profil').select('*').order('name'),
    db.from('v_kenntnis_stand').select('*'),
    db.from('v_anlagen_stand').select('*')
  ]);
  const err=[pr,vs,va].find(r=>r.error);
  if(err){ fehler(err.error); return; }
  S.teamProfile=pr.data||[];
  S.teamStand=[
    ...(vs.data||[]).map(r=>({...r, art:'strecke', objekt_id:r.strecke_id, objekt:r.strecke_name, zusatz:r.linie, letzte:r.letzte_befahrung})),
    ...(va.data||[]).map(r=>({...r, art:'anlage',  objekt_id:r.punkt_id,   objekt:r.punkt_name,   zusatz:r.abk,   letzte:r.letzte_taetigkeit}))
  ];
}

/* ============================================================
   Bausteine
   ============================================================ */
function band(s){
  const ids=(s.punkte||[]).filter(id=>punkt(id));
  if(!ids.length) return '<div class="band"><span class="rest">keine Betriebspunkte erfasst</span></div>';
  let sicht=ids, gek=0;
  if(ids.length>6){ sicht=[...ids.slice(0,3),null,...ids.slice(-2)]; gek=ids.length-5; }
  let h='<div class="band">';
  sicht.forEach((id,i)=>{
    if(i>0) h+='<span class="schiene"></span>';
    if(id===null){ h+=`<span class="rest">+${gek}</span>`; return; }
    const r=(i===0||i===sicht.length-1)?' rand':'';
    h+=`<span class="bp"><span class="knoten${r}"></span><span class="code${r}">${esc(code(id))}</span></span>`;
  });
  return h+'</div>';
}
function gleisfeld(p){
  const n=(p.abk+p.name).split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  const breiten=[0,1,2,3].map(i=>34+((n>>(i*3))%9)*7);
  return `<div class="gleisfeld">${breiten.map(b=>`<i style="width:${b}%"></i>`).join('')}</div>`;
}
function fristZeile(z,a,k){
  const t=a?tageBis(a):null;
  if(z==='abgelaufen') return `<div class="frist rot">Abgelaufen am <b>${datum(a)}</b> · ${Math.abs(t)} Tage überfällig</div>`;
  if(z==='warnung')    return `<div class="frist gelb">Gültig bis <b>${datum(a)}</b> · noch ${t} Tage</div>`;
  if(z==='gueltig'&&a) return `<div class="frist">Gültig bis <b>${datum(a)}</b> · noch ${t} Tage</div>`;
  if(z==='gueltig')    return `<div class="frist">Kein Datum erfasst — Frist nicht berechenbar</div>`;
  if(z==='ausbildung') return `<div class="frist">In Ausbildung${k.erwerb?' · seit '+datum(k.erwerb):''}</div>`;
  return `<div class="frist">Noch keine Kenntnis erfasst</div>`;
}
function balken(z,a){
  if(!a||!['gueltig','warnung','abgelaufen'].includes(z)) return '';
  const anteil=Math.max(0,Math.min(100,(tageBis(a)/(S.konfig.gueltig_monate*30.4))*100));
  return `<div class="balken"><i style="width:${anteil.toFixed(1)}%;background:${ZFARBE[z]}"></i></div>`;
}

function nummern(s){
  return (s.linie?`<span class="linienr" title="Streckennummer BAV">${esc(s.linie)}</span>`:'')
       + (s.tabelle?`<span class="linienr" title="Streckentabelle R 30131" style="border-style:dashed">${esc(s.tabelle)}</span>`:'');
}
function streckeKarte(s){
  const z=zustandS(s.id), a=ablaufS(s.id);
  const stamm = istAdmin() || s.erstellt_von===S.user.id;
  return `<div class="karte">
    <div class="kopfzeile"><span class="lampe ${z}" title="${ZTEXT[z]}"></span>
      <span class="titel">${esc(s.name)}</span>${nummern(s)}</div>
    ${band(s)}${fristZeile(z,a,kenntnisS(s.id))}${balken(z,a)}
    <div class="aktionen">
      <button class="btn haupt" data-tat="gefahren" data-id="${s.id}">Heute gefahren</button>
      <button class="btn" data-tat="kenntnis-s" data-id="${s.id}">Kenntnis</button>
      ${stamm?`<button class="btn" data-tat="strecke-bearbeiten" data-id="${s.id}">Strecke</button>`:''}
    </div></div>`;
}
function anlageKarte(p){
  const z=zustandA(p.id), a=ablaufA(p.id);
  const stamm = istAdmin() || p.erstellt_von===S.user.id;
  const inStrecken=S.strecken.filter(s=>(s.punkte||[]).includes(p.id)).length;
  return `<div class="karte">
    <div class="kopfzeile"><span class="lampe ${z}" title="${ZTEXT[z]}"></span>
      <span class="titel">${esc(p.name)}</span><span class="linienr">${esc(p.abk)}</span></div>
    ${gleisfeld(p)}
    <div class="meta">${esc(p.typ||'Bahnhof')}${p.bahn?' · '+esc(p.bahn):''}${inStrecken?` · in ${inStrecken} Strecke(n)`:''}</div>
    ${fristZeile(z,a,kenntnisA(p.id))}${balken(z,a)}
    <div class="aktionen">
      <button class="btn haupt" data-tat="gearbeitet" data-id="${p.id}">Heute gearbeitet</button>
      <button class="btn" data-tat="kenntnis-a" data-id="${p.id}">Kenntnis</button>
      ${stamm?`<button class="btn" data-tat="punkt-bearbeiten" data-id="${p.id}">Anlage</button>`:''}
    </div></div>`;
}

const FILTERCHIPS=[['alle','Alle'],['gueltig','Gültig'],['warnung','Läuft ab'],['abgelaufen','Abgelaufen'],['ausbildung','Ausbildung'],['keine','Keine']];
const chips = () => `<div class="chips">${FILTERCHIPS.map(([k,t])=>
  `<button class="chip ${FILTER===k?'an':''}" data-tat="filter" data-wert="${k}">${k!=='alle'?`<span class="lampe ${k} klein"></span>`:''}${t}</button>`).join('')}</div>`;

function ansichtUebersicht(){
  const z={gueltig:0,warnung:0,abgelaufen:0,ausbildung:0,keine:0};
  S.strecken.forEach(s=>z[zustandS(s.id)]++);
  S.punkte.forEach(p=>z[zustandA(p.id)]++);
  const dringendS=S.strecken.filter(s=>['abgelaufen','warnung'].includes(zustandS(s.id)))
    .sort((a,b)=>(ablaufS(a.id)||'9999').localeCompare(ablaufS(b.id)||'9999'));
  const dringendA=S.punkte.filter(p=>['abgelaufen','warnung'].includes(zustandA(p.id)))
    .sort((a,b)=>(ablaufA(a.id)||'9999').localeCompare(ablaufA(b.id)||'9999'));

  if(!S.strecken.length && !S.punkte.length){
    return `<div class="leer"><b>Noch keine Stammdaten</b>
      Anlagen und Strecken sind für alle Mitarbeitenden gemeinsam. Der Administrator kann unter Konto ein Startgerüst laden.</div>
      <div style="height:12px"></div>
      <button class="btn haupt voll" data-tat="punkt-neu" style="margin-bottom:8px">Anlage erfassen</button>
      <button class="btn voll" data-tat="strecke-neu">Strecke erfassen</button>`;
  }
  return `
  <div class="abschnitt">
    <h2>${esc(S.profil.name||'Mein Stand')} · ${datum(heute())}</h2>
    <div class="kacheln">
      <div class="kachel"><div class="zahl">${z.gueltig}</div><div class="bez"><span class="lampe gueltig klein"></span>Gültig</div></div>
      <div class="kachel"><div class="zahl">${z.warnung}</div><div class="bez"><span class="lampe warnung klein"></span>Läuft ab</div></div>
      <div class="kachel"><div class="zahl">${z.abgelaufen}</div><div class="bez"><span class="lampe abgelaufen klein"></span>Abgelaufen</div></div>
      <div class="kachel"><div class="zahl">${z.ausbildung}</div><div class="bez"><span class="lampe ausbildung klein"></span>Ausbildung</div></div>
    </div>
  </div>
  ${dringendS.length?`<div class="abschnitt"><h2>Strecken · Aufmerksamkeit <span class="mono">${dringendS.length}</span></h2>
    ${dringendS.map(streckeKarte).join('')}</div>`:''}
  ${dringendA.length?`<div class="abschnitt"><h2>Anlagen · Aufmerksamkeit <span class="mono">${dringendA.length}</span></h2>
    ${dringendA.map(anlageKarte).join('')}</div>`:''}
  ${(!dringendS.length&&!dringendA.length)?`<div class="abschnitt"><h2>Aufmerksamkeit</h2>
    <div class="leer">Nichts läuft in den nächsten ${S.konfig.warn_tage} Tagen ab.</div></div>`:''}
  <div class="fussnote">Frist = letzte Befahrung beziehungsweise letzter Einsatz plus ${S.konfig.gueltig_monate} Monate. Die Regel gilt für Strecken und Anlagen gleichermassen und wird vom Administrator gesetzt.</div>`;
}

function ansichtStrecken(){
  const q=SUCHE.toLowerCase();
  const liste=S.strecken.filter(s=>{
    if(FILTER!=='alle'&&zustandS(s.id)!==FILTER) return false;
    if(!q) return true;
    return (s.name+' '+(s.linie||'')+' '+(s.tabelle||'')+' '+(s.punkte||[]).map(code).join(' ')).toLowerCase().includes(q);
  });
  const rang={abgelaufen:0,warnung:1,ausbildung:2,gueltig:3,keine:4};
  liste.sort((a,b)=>rang[zustandS(a.id)]-rang[zustandS(b.id)]||a.name.localeCompare(b.name,'de'));
  return `<input class="suche" id="suchfeld" placeholder="Strecke, Linie oder Betriebspunkt suchen" value="${esc(SUCHE)}">
  ${chips()}
  <button class="btn haupt voll" data-tat="strecke-neu" style="margin-bottom:12px">Strecke erfassen</button>
  ${liste.length?liste.map(streckeKarte).join(''):`<div class="leer"><b>Keine Treffer</b>Suche oder Filter anpassen.</div>`}`;
}

function ansichtAnlagen(){
  const q=SUCHE.toLowerCase();
  const liste=S.punkte.filter(p=>{
    if(FILTER!=='alle'&&zustandA(p.id)!==FILTER) return false;
    if(!q) return true;
    return (p.abk+' '+p.name+' '+(p.bahn||'')+' '+(p.typ||'')).toLowerCase().includes(q);
  });
  const rang={abgelaufen:0,warnung:1,ausbildung:2,gueltig:3,keine:4};
  liste.sort((a,b)=>rang[zustandA(a.id)]-rang[zustandA(b.id)]||a.name.localeCompare(b.name,'de'));
  return `<input class="suche" id="suchfeld" placeholder="Anlage, Abkürzung oder Typ suchen" value="${esc(SUCHE)}">
  ${chips()}
  <button class="btn haupt voll" data-tat="punkt-neu" style="margin-bottom:12px">Anlage erfassen</button>
  ${liste.length?liste.map(anlageKarte).join(''):`<div class="leer"><b>Keine Treffer</b>Anlagen sind Bahnhöfe, Rangierbahnhöfe, Anschlussgleise und Abstellanlagen.</div>`}`;
}

function ansichtTeam(){
  if(!istAdmin()) return `<div class="leer"><b>Kein Zugriff</b>Diese Auswertung ist Administratoren vorbehalten.</div>`;
  const q=SUCHE.toLowerCase();
  const zaehlen=r=>{ const z={gueltig:0,warnung:0,abgelaufen:0,ausbildung:0};
    r.forEach(x=>{ if(z[x.zustand]!==undefined) z[x.zustand]++; }); return z; };
  const ampel=z=>`<span class="ampel">
    <span><span class="lampe gueltig klein"></span>${z.gueltig}</span>
    <span><span class="lampe warnung klein"></span>${z.warnung}</span>
    <span><span class="lampe abgelaufen klein"></span>${z.abgelaufen}</span></span>`;

  let inhalt;
  if(TEAMMODUS==='mitarbeiter'){
    const leute=S.teamProfile.filter(p=>((p.name||'')+' '+(p.personalnummer||'')+' '+(p.depot||'')).toLowerCase().includes(q));
    inhalt=leute.length?`<div class="liste">${leute.map(p=>{
      const z=zaehlen(S.teamStand.filter(r=>r.benutzer_id===p.id));
      return `<div class="punkt" data-tat="team-person" data-id="${p.id}">
        <span class="abk">${esc((p.personalnummer||'—').slice(0,6))}</span>
        <span class="txt"><span class="n">${esc(p.name||'Ohne Namen')}</span>
        <span class="m">${FUNKTION[fkt(p)]}${p.depot?' · '+esc(p.depot):''}${p.rolle==='admin'?' · Administrator':''}</span></span>${ampel(z)}
      </div>`;}).join('')}</div>`:`<div class="leer">Keine Mitarbeitenden gefunden.</div>`;
  } else {
    const objekte = TEAMMODUS==='strecke'
      ? S.strecken.filter(s=>(s.name+' '+(s.linie||'')).toLowerCase().includes(q))
          .map(s=>({id:s.id,name:s.name,zusatz:s.linie||'—',art:'strecke'}))
      : S.punkte.filter(p=>(p.name+' '+p.abk).toLowerCase().includes(q))
          .map(p=>({id:p.id,name:p.name,zusatz:p.abk,art:'anlage'}));
    objekte.sort((a,b)=>a.name.localeCompare(b.name,'de'));
    inhalt=objekte.length?`<div class="liste">${objekte.map(o=>{
      const z=zaehlen(S.teamStand.filter(r=>r.objekt_id===o.id&&r.art===o.art));
      return `<div class="punkt" data-tat="team-objekt" data-id="${o.id}" data-wert="${o.art}">
        <span class="abk">${esc(o.zusatz)}</span>
        <span class="txt"><span class="n">${esc(o.name)}</span>
        <span class="m">${z.gueltig} von ${S.teamProfile.length} Mitarbeitenden einsatzbereit</span></span>${ampel(z)}
      </div>`;}).join('')}</div>`:`<div class="leer">Nichts gefunden.</div>`;
  }

  const g=zaehlen(S.teamStand);
  return `
  <div class="abschnitt"><h2>Betriebsübersicht · ${S.teamProfile.length} Konten</h2>
    <div class="kacheln">
      <div class="kachel"><div class="zahl">${g.gueltig}</div><div class="bez"><span class="lampe gueltig klein"></span>Gültig</div></div>
      <div class="kachel"><div class="zahl">${g.warnung}</div><div class="bez"><span class="lampe warnung klein"></span>Läuft ab</div></div>
      <div class="kachel"><div class="zahl">${g.abgelaufen}</div><div class="bez"><span class="lampe abgelaufen klein"></span>Abgelaufen</div></div>
      <div class="kachel"><div class="zahl">${g.ausbildung}</div><div class="bez"><span class="lampe ausbildung klein"></span>Ausbildung</div></div>
    </div></div>
  <div class="chips">
    <button class="chip ${TEAMMODUS==='mitarbeiter'?'an':''}" data-tat="teammodus" data-wert="mitarbeiter">Nach Mitarbeiter</button>
    <button class="chip ${TEAMMODUS==='strecke'?'an':''}" data-tat="teammodus" data-wert="strecke">Nach Strecke</button>
    <button class="chip ${TEAMMODUS==='anlage'?'an':''}" data-tat="teammodus" data-wert="anlage">Nach Anlage</button>
  </div>
  <input class="suche" id="suchfeld" placeholder="${TEAMMODUS==='mitarbeiter'?'Name, Personalnummer oder Depot':'Bezeichnung suchen'}" value="${esc(SUCHE)}">
  ${inhalt}
  <div class="aktionen" style="margin-top:14px">
    <button class="btn" data-tat="team-csv">Auswertung als CSV</button>
    <button class="btn" data-tat="team-neu-laden">Aktualisieren</button>
  </div>`;
}

/* ============================================================
   Karte
   ============================================================ */
function hatKoord(p){ return p && p.lat!=null && p.lon!=null; }

/* Karte zeigt entweder den eigenen Stand oder — für Administratoren —
   den einer ausgewählten Person aus der Auswertung. */
function fremdZeile(art,id){
  return S.teamStand.find(r=>r.benutzer_id===KARTENPERSON && r.art===art && r.objekt_id===id);
}
function kZustand(art,id){
  if(!KARTENPERSON) return art==='strecke'?zustandS(id):zustandA(id);
  const r=fremdZeile(art,id);
  return r?r.zustand:'keine';
}
function kAblauf(art,id){
  if(!KARTENPERSON) return art==='strecke'?ablaufS(id):ablaufA(id);
  const r=fremdZeile(art,id);
  return r&&r.ablauf?String(r.ablauf).slice(0,10):'';
}
function darfStamm(o){ return istAdmin() || (o && o.erstellt_von===S.user.id); }

function streckenGeometrie(st){
  if(Array.isArray(st.verlauf) && st.verlauf.length>1) return st.verlauf.map(k=>[k[0],k[1]]);
  return (st.punkte||[]).map(punkt).filter(hatKoord).map(p=>[p.lat,p.lon]);
}

function ansichtKarte(){
  const ohne = S.punkte.filter(p=>!hatKoord(p)).length;
  const zeichenbar = S.strecken.filter(st=>streckenGeometrie(st).length>=2);
  const stumm = S.strecken.filter(st=>streckenGeometrie(st).length<2);
  const ohneNr = zeichenbar.filter(st=>!st.linie && !st.tabelle);
  const gerade = zeichenbar.filter(st=>!(Array.isArray(st.verlauf)&&st.verlauf.length>1));
  const wahl = KARTENMODUS==='punkt'
    ? `<label style="margin-bottom:9px"><span>Betriebspunkt wählen, dann auf die Karte tippen</span>
        <select id="kz-punkt">${S.punkte.slice().sort((a,b)=>(hatKoord(a)?1:0)-(hatKoord(b)?1:0)||a.name.localeCompare(b.name,'de'))
          .map(p=>`<option value="${p.id}"${KARTENZIEL===p.id?' selected':''}>${hatKoord(p)?'●':'○'} ${esc(p.abk)} — ${esc(p.name)}</option>`).join('')}</select></label>`
    : KARTENMODUS==='verlauf'
    ? `<label style="margin-bottom:9px"><span>Strecke wählen, dann Stützpunkte antippen</span>
        <select id="kz-strecke">${S.strecken.slice().sort((a,b)=>a.name.localeCompare(b.name,'de'))
          .map(st=>`<option value="${st.id}"${KARTENZIEL===st.id?' selected':''}>${esc(st.name)}</option>`).join('')}</select></label>
       <div class="aktionen" style="margin:0 0 9px">
         <button class="btn haupt" data-tat="verlauf-auto">Gleisen folgen lassen</button>
         <button class="btn" data-tat="verlauf-sichern">Handverlauf sichern (${VERLAUF.length})</button>
         <button class="btn" data-tat="verlauf-zurueck">Letzter Punkt weg</button>
         <button class="btn gefahr" data-tat="verlauf-leeren">Alles löschen</button>
       </div>`
    : '';

  const hinweis = KARTENMODUS==='punkt'
    ? '<div class="hinweisbalken">Tippe an die Stelle, an der der gewählte Betriebspunkt liegt. Die Koordinate wird sofort gespeichert. Bereits gesetzte Punkte lassen sich mit dem Finger verschieben.</div>'
    : KARTENMODUS==='verlauf'
    ? '<div class="hinweisbalken">«Gleisen folgen lassen» berechnet den Verlauf aus dem Schienennetz von OpenStreetMap — das dauert je Abschnitt einige Sekunden. Von Hand tippen geht auch, etwa wenn kein Gleis erfasst ist.</div>'
    : '';

function karteAufbauen(){
  const box=document.getElementById('karte-box');
  if(!box || typeof L==='undefined') return;
  if(KARTE){ KARTE.remove(); KARTE=null; }

  KARTE = L.map(box,{ center:KARTENSICHT.center, zoom:KARTENSICHT.zoom, zoomControl:true, attributionControl:true });
  KARTE.on('moveend zoomend', ()=>{ const c=KARTE.getCenter(); KARTENSICHT={center:[c.lat,c.lng], zoom:KARTE.getZoom()}; });

  const swissGrau = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-grau/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom:19, attribution:'© swisstopo' });
  const swissFarbe = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.swisstopo.pixelkarte-farbe/default/current/3857/{z}/{x}/{y}.jpeg',
    { maxZoom:19, attribution:'© swisstopo' });
  const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, attribution:'© OpenStreetMap' });
  const bahn = L.tileLayer('https://a.tiles.openrailwaymap.org/standard/{z}/{x}/{y}.png',
    { maxZoom:19, opacity:.9, attribution:'© OpenRailwayMap' });

  const bav = L.tileLayer('https://wmts.geo.admin.ch/1.0.0/ch.bav.schienennetz/default/current/3857/{z}/{x}/{y}.png',
    { maxZoom:19, opacity:.95, attribution:'© BAV' });

  swissGrau.addTo(KARTE); bahn.addTo(KARTE);
  L.control.layers({ 'Landeskarte grau':swissGrau, 'Landeskarte farbig':swissFarbe, 'OpenStreetMap':osm },
                   { 'Bahnnetz (OpenRailwayMap)':bahn, 'Schienennetz BAV':bav }, { collapsed:true }).addTo(KARTE);

  /* Strecken als Linien, eingefärbt nach eigenem Kenntnisstand */
  S.strecken.forEach(st=>{
    const pfad=streckenGeometrie(st);
    if(pfad.length<2) return;
    const z=kZustand('strecke',st.id), a=kAblauf('strecke',st.id);
    const teile=[];
    if(st.linie)   teile.push(`<span class="ss-art">Strecke</span> <span class="ss-nr">${esc(st.linie)}</span>`);
    if(st.tabelle) teile.push(`<span class="ss-art">Tabelle</span> <span class="ss-tab">${esc(st.tabelle)}</span>`);
    const schild = teile.join(' <span class="ss-strich">|</span> ');
    const linie = L.polyline(pfad,{ color:ZHEX[z], weight:z==='keine'?3:5, opacity:z==='keine'?.55:.9,
      dashArray: st.verlauf&&st.verlauf.length>1 ? null : '9 7' })
     .addTo(KARTE);
    if(schild) linie.bindTooltip(schild,{ permanent:true, direction:'center',
      className:'streckenschild', opacity:1 });
    linie.bindPopup(`<b>${esc(st.name)}</b><span class="pm">${st.linie?'BAV '+esc(st.linie)+' · ':''}${st.tabelle?'TAB '+esc(st.tabelle)+' · ':''}STRECKE</span>
       ${ZTEXT[z]}${a?' · bis '+datum(a):''}${KARTENPERSON?'':`<br>
       <button class="btn klein haupt" data-tat="gefahren" data-id="${st.id}" style="margin-top:8px">Heute gefahren</button>
       <button class="btn klein" data-tat="kenntnis-s" data-id="${st.id}" style="margin-top:8px">Kenntnis</button>`}`);
  });

  /* Betriebspunkte */
  const beweglich = KARTENMODUS==='punkt' && !KARTENPERSON;
  S.punkte.filter(hatKoord).forEach(p=>{
    const z=kZustand('anlage',p.id), a=kAblauf('anlage',p.id);
    const m=L.circleMarker([p.lat,p.lon],{ radius:7, color:'#14181b', weight:2,
      fillColor:ZHEX[z], fillOpacity:1 }).addTo(KARTE);
    m.bindPopup(`<b>${esc(p.name)}</b><span class="pm">${esc(p.abk)} · ${esc(p.typ||'Bahnhof')}</span>
      ${ZTEXT[z]}${a?' · bis '+datum(a):''}${KARTENPERSON?'':`<br>
      <button class="btn klein haupt" data-tat="gearbeitet" data-id="${p.id}" style="margin-top:8px">Heute gearbeitet</button>
      <button class="btn klein" data-tat="kenntnis-a" data-id="${p.id}" style="margin-top:8px">Kenntnis</button>`}`);
    if(beweglich && darfStamm(p)){
      const zieh=L.marker([p.lat,p.lon],{ draggable:true, opacity:.35 }).addTo(KARTE);
      zieh.on('dragend', async ev=>{
        const ll=ev.target.getLatLng();
        await koordinateSichern(p.id, ll.lat, ll.lng);
      });
    }
  });

  /* Entwurf des Streckenverlaufs */
  if(KARTENMODUS==='verlauf' && VERLAUF.length){
    L.polyline(VERLAUF,{ color:'#e8edef', weight:3, dashArray:'4 6' }).addTo(KARTE);
    VERLAUF.forEach(k=>L.circleMarker(k,{ radius:4, color:'#e8edef', weight:1, fillColor:'#14181b', fillOpacity:1 }).addTo(KARTE));
  }

  KARTE.on('click', async ev=>{
    if(KARTENMODUS==='punkt'){
      const sel=document.getElementById('kz-punkt');
      if(!sel||!sel.value){ meldung('Zuerst einen Betriebspunkt wählen', true); return; }
      const p=punkt(sel.value);
      if(!darfStamm(p)){ meldung('Nur die erfassende Person oder ein Administrator darf diesen Punkt verschieben', true); return; }
      KARTENZIEL=sel.value;
      await koordinateSichern(sel.value, ev.latlng.lat, ev.latlng.lng);
    } else if(KARTENMODUS==='verlauf'){
      const sel=document.getElementById('kz-strecke');
      if(sel) KARTENZIEL=sel.value;
      VERLAUF.push([+ev.latlng.lat.toFixed(5), +ev.latlng.lng.toFixed(5)]);
      zeichnen();
    }
  });

  setTimeout(()=>{ if(KARTE) KARTE.invalidateSize(); }, 120);
}

async function koordinateSichern(id, lat, lon){
  const {error}=await db.from('betriebspunkt')
    .update({ lat:+lat.toFixed(6), lon:+lon.toFixed(6) }).eq('id',id);
  if(error) return fehler(error);
  await alleLaden(); zeichnen(); meldung('Koordinate gesetzt');
}

/* ============================================================
   Koordinatensuche — swisstopo, sonst OpenStreetMap
   ============================================================ */
const IN_CH = (la,lo) => la>45.6 && la<48.0 && lo>5.7 && lo<10.7;

function ausAttrs(a){
  if(!a) return null;
  const la = a.lat!=null ? +a.lat : (a.y!=null ? +a.y : null);
  const lo = a.lon!=null ? +a.lon : (a.x!=null ? +a.x : null);
  return (la!=null && lo!=null && IN_CH(la,lo)) ? {lat:la, lon:lo} : null;
}

async function geokodieren(p){
  const text = encodeURIComponent(p.name||'');
  if(!text) return null;

  /* 1) Haltestellen des öffentlichen Verkehrs (BAV) */
  try{
    const r=await fetch(`https://api3.geo.admin.ch/rest/services/api/SearchServer?type=featuresearch&features=ch.bav.haltestellen-oev&sr=4326&limit=1&searchText=${text}`);
    const j=await r.json();
    const k=ausAttrs(j.results && j.results[0] && j.results[0].attrs);
    if(k) return {...k, quelle:'öV-Haltestellen'};
  }catch(e){}

  /* 2) Ortsnamen der Landestopografie */
  try{
    const r=await fetch(`https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&sr=4326&limit=1&searchText=${text}`);
    const j=await r.json();
    const k=ausAttrs(j.results && j.results[0] && j.results[0].attrs);
    if(k) return {...k, quelle:'swisstopo'};
  }catch(e){}

  /* 3) OpenStreetMap als Rückfallebene */
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ch&q=${encodeURIComponent('Bahnhof '+(p.name||''))}`);
    const j=await r.json();
    if(j[0] && IN_CH(+j[0].lat,+j[0].lon)) return {lat:+j[0].lat, lon:+j[0].lon, quelle:'OpenStreetMap'};
  }catch(e){}

  return null;
}

/* Setzt fehlende Koordinaten still im Hintergrund — ohne Fehlermeldung,
   falls die Person die Stammdaten nicht ändern darf. */
async function koordinatenNachziehen(punktIds){
  const offen=[...new Set(punktIds)].map(punkt)
    .filter(p=>p && !hatKoord(p) && darfStamm(p));
  if(!offen.length) return false;
  let gesetzt=0;
  for(const p of offen){
    const k=await geokodieren(p);
    if(k){
      const {error}=await db.from('betriebspunkt').update({lat:k.lat, lon:k.lon}).eq('id',p.id);
      if(!error) gesetzt++;
    }
    await new Promise(r=>setTimeout(r,350));
  }
  return gesetzt>0;
}

/* ============================================================
   Gleisverlauf aus OpenStreetMap — kürzester Weg auf dem Schienennetz
   ============================================================ */
function meterAbstand(a,b){
  const R=6371000, t=Math.PI/180;
  const dφ=(b[0]-a[0])*t, dλ=(b[1]-a[1])*t, φ=(a[0]+b[0])/2*t;
  const x=dλ*Math.cos(φ);
  return Math.sqrt(dφ*dφ + x*x)*R;
}

async function gleiseHolen(a,b,weite){
  const f=weite||1;
  const puffer=Math.max(0.025, Math.abs(a[0]-b[0])*0.4, Math.abs(a[1]-b[1])*0.4)*f;
  const s=Math.min(a[0],b[0])-puffer, n=Math.max(a[0],b[0])+puffer;
  const w=Math.min(a[1],b[1])-puffer, e=Math.max(a[1],b[1])+puffer;
  /* Alle befahrbaren Gleise, auch Bahnhofs- und Verbindungsgleise —
     sonst reisst der Weg genau in den Bahnhöfen ab. */
  const q=`[out:json][timeout:120];way["railway"~"^(rail|light_rail|narrow_gauge)$"]`
        + `(${s},${w},${n},${e});out body;>;out skel qt;`;
  const server=['https://overpass-api.de/api/interpreter',
                'https://overpass.kumi.systems/api/interpreter'];
  let letzter='';
  for(const url of server){
    try{
      const r=await fetch(url,{ method:'POST', body:'data='+encodeURIComponent(q) });
      if(!r.ok){ letzter='Gleisdatenserver antwortet mit '+r.status; continue; }
      const j=await r.json();
      return j.elements||[];
    }catch(e){ letzter='Gleisdatenserver nicht erreichbar'; }
  }
  throw new Error(letzter||'Gleisdaten nicht erreichbar');
}

function graphBauen(elemente){
  const roh=new Map();
  elemente.forEach(e=>{ if(e.type==='node') roh.set(e.id,{lat:e.lat,lon:e.lon}); });
  const G=new Map();
  const hole=id=>{
    if(!G.has(id)){ const k=roh.get(id); if(!k) return null; G.set(id,{lat:k.lat,lon:k.lon,n:[]}); }
    return G.get(id);
  };
  elemente.forEach(e=>{
    if(e.type!=='way' || !e.nodes) return;
    for(let i=1;i<e.nodes.length;i++){
      const A=hole(e.nodes[i-1]), B=hole(e.nodes[i]);
      if(!A||!B||e.nodes[i-1]===e.nodes[i]) continue;
      const d=meterAbstand([A.lat,A.lon],[B.lat,B.lon]);
      A.n.push([e.nodes[i], d]);
      B.n.push([e.nodes[i-1], d]);
    }
  });
  return G;
}

function naechsterKnoten(G,pt){
  let best=null, bd=Infinity;
  G.forEach((v,k)=>{ const d=meterAbstand(pt,[v.lat,v.lon]); if(d<bd){ bd=d; best=k; } });
  return {k:best, d:bd};
}

function kuerzesterWeg(G,start,ziel){
  const heap=[], dist=new Map([[start,0]]), vor=new Map(), fertig=new Set();
  const rein=x=>{ heap.push(x); let i=heap.length-1;
    while(i>0){ const p=(i-1)>>1; if(heap[p][0]<=heap[i][0]) break;
      [heap[p],heap[i]]=[heap[i],heap[p]]; i=p; } };
  const raus=()=>{ const top=heap[0], last=heap.pop();
    if(heap.length){ heap[0]=last; let i=0;
      for(;;){ const l=2*i+1, r=l+1; let m=i;
        if(l<heap.length&&heap[l][0]<heap[m][0]) m=l;
        if(r<heap.length&&heap[r][0]<heap[m][0]) m=r;
        if(m===i) break; [heap[m],heap[i]]=[heap[i],heap[m]]; i=m; } }
    return top; };
  rein([0,start]);
  while(heap.length){
    const [d,k]=raus();
    if(fertig.has(k)) continue;
    fertig.add(k);
    if(k===ziel) break;
    const v=G.get(k); if(!v) continue;
    for(const [nk,nd] of v.n){
      const alt=d+nd;
      if(alt < (dist.has(nk)?dist.get(nk):Infinity)){ dist.set(nk,alt); vor.set(nk,k); rein([alt,nk]); }
    }
  }
  if(start!==ziel && !vor.has(ziel)) return null;
  const pfad=[]; let k=ziel, schutz=0;
  while(k && schutz++<200000){ const v=G.get(k); pfad.unshift([v.lat,v.lon]); k=vor.get(k); }
  return pfad;
}

/* Douglas-Peucker — hält die Punktzahl klein, ohne den Verlauf zu verfälschen */
function ausduennen(pfad, tol){
  if(pfad.length<3) return pfad;
  const rekursiv=(pts)=>{
    let max=0, idx=0;
    const [a,b]=[pts[0], pts[pts.length-1]];
    for(let i=1;i<pts.length-1;i++){
      const d=abstandZurLinie(pts[i],a,b);
      if(d>max){ max=d; idx=i; }
    }
    if(max>tol){
      const l=rekursiv(pts.slice(0,idx+1)), r=rekursiv(pts.slice(idx));
      return l.slice(0,-1).concat(r);
    }
    return [a,b];
  };
  return rekursiv(pfad);
}
function abstandZurLinie(p,a,b){
  const l2=Math.pow(meterAbstand(a,b),2);
  if(l2===0) return meterAbstand(p,a);
  const t=Math.max(0, Math.min(1,
    (((p[0]-a[0])*(b[0]-a[0]) + (p[1]-a[1])*(b[1]-a[1])) /
     (Math.pow(b[0]-a[0],2)+Math.pow(b[1]-a[1],2))) || 0));
  return meterAbstand(p,[a[0]+t*(b[0]-a[0]), a[1]+t*(b[1]-a[1])]);
}

async function verlaufErmitteln(st){
  const pkte=(st.punkte||[]).map(punkt).filter(hatKoord).map(p=>[p.lat,p.lon]);
  if(pkte.length<2) throw new Error('Mindestens zwei Betriebspunkte mit Koordinate nötig');
  let gesamt=[];
  for(let i=1;i<pkte.length;i++){
    if(meterAbstand(pkte[i-1],pkte[i])>80000)
      throw new Error('Abschnitt zu lang — Zwischenbetriebspunkte erfassen');
    let teil=null, grund='', versuch=0;
    while(!teil && versuch<2){
      versuch++;
      meldung(`${st.name}: Abschnitt ${i} von ${pkte.length-1}${versuch>1?' — grösserer Ausschnitt':''} …`);
      const elemente=await gleiseHolen(pkte[i-1], pkte[i], versuch===1?1:2.4);
      if(!elemente.length){ grund='Keine Gleisdaten in diesem Bereich'; }
      else {
        const G=graphBauen(elemente);
        const a=naechsterKnoten(G,pkte[i-1]), b=naechsterKnoten(G,pkte[i]);
        if(a.d>1500 || b.d>1500) grund='Betriebspunkt liegt '+Math.round(Math.max(a.d,b.d))+' m vom nächsten Gleis — Koordinate prüfen';
        else {
          teil=kuerzesterWeg(G,a.k,b.k);
          if(!teil) grund='Keine durchgehende Gleisverbindung gefunden';
        }
      }
      if(!teil && versuch<2) await new Promise(r=>setTimeout(r,1300));
    }
    if(!teil) throw new Error(grund+' (Abschnitt '+i+')');
    gesamt = gesamt.length ? gesamt.concat(teil.slice(1)) : teil;
    if(i<pkte.length-1) await new Promise(r=>setTimeout(r,1100));
  }
  return ausduennen(gesamt, 12).map(k=>[+k[0].toFixed(5), +k[1].toFixed(5)]);
}

function bahnKuerzen(op){
  if(!op) return '';
  const t=String(op);
  const karte=[[/bundesbahn|SBB|CFF|FFS/i,'SBB'],[/BLS/i,'BLS'],[/Südostbahn|SOB/i,'SOB'],
    [/Zentralbahn|\bzb\b/i,'zb'],[/Rhätische|RhB/i,'RhB'],[/Matterhorn|MGB/i,'MGB'],
    [/Fribourgeois|TPF/i,'TPF'],[/Appenzeller/i,'AB'],[/Solothurn-Münster|ASm/i,'ASm'],
    [/Bern-Solothurn|RBS/i,'RBS'],[/Montreux|MOB/i,'MOB'],[/Martigny|TMR/i,'TMR'],
    [/Sihltal|SZU/i,'SZU'],[/Forch/i,'Forchbahn'],[/TRAVYS/i,'TRAVYS'],[/Aargau Verkehr|WSB|AVA/i,'AVA'],
    [/Deutsche Bahn|^DB/i,'DB'],[/Österreichische|ÖBB/i,'ÖBB'],[/SNCF/i,'SNCF'],[/Trenitalia|\bFS\b/i,'FS']];
  for(const [re,kurz] of karte) if(re.test(t)) return kurz;
  return t.length<=14 ? t : t.slice(0,14);
}
const OSM_TYP={station:'Bahnhof', halt:'Haltestelle', junction:'Abzweigung',
  service_station:'Dienststation', yard:'Abstellanlage'};

/* ---------- Suche: eigenes Verzeichnis, amtliche Haltestellen, OpenStreetMap ---------- */
let SUCHLAUF=null, SUCH_ABBRUCH=null;
const SUCH_SPEICHER=new Map();

async function osmBetriebspunkte(q, signal){
  if(SUCH_SPEICHER.has(q)) return SUCH_SPEICHER.get(q);
  const sicher=q.replace(/[\\^$.*+?()[\]{}|"]/g,'.');
  const kasten='45.75,5.80,47.95,10.70';
  const typen='^(station|halt|junction|service_station|yard)$';
  const query=`[out:json][timeout:30];`
    + `(node["railway"~"${typen}"]["name"~"${sicher}",i](${kasten});`
    + `way["railway"~"${typen}"]["name"~"${sicher}",i](${kasten}););`
    + `out tags center 40;`;
  const server=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
  let letzter='';
  for(const url of server){
    try{
      const r=await fetch(url,{ method:'POST', body:'data='+encodeURIComponent(query), signal });
      if(!r.ok){ letzter = r.status===429 ? 'Gleisdatenserver gerade überlastet' : 'Antwort '+r.status; continue; }
      const j=await r.json();
      const raus=(j.elements||[]).map(e=>{
        const t=e.tags||{};
        const lat=e.lat!=null?e.lat:(e.center&&e.center.lat);
        const lon=e.lon!=null?e.lon:(e.center&&e.center.lon);
        if(lat==null||lon==null||!t.name) return null;
        return { abk:String(t['railway:ref']||t.ref||'').trim(), name:String(t.name).trim(),
                 typ:OSM_TYP[t.railway]||'Bahnhof', bahn:bahnKuerzen(t.operator),
                 lat:+lat, lon:+lon, quelle:'OpenStreetMap' };
      }).filter(Boolean);
      SUCH_SPEICHER.set(q, raus);
      return raus;
    }catch(e){
      if(e.name==='AbortError') throw e;
      letzter='nicht erreichbar';
    }
  }
  const leer=[]; leer.hinweis=letzter; return leer;
}

async function bpSuchen(q){
  q=q.trim();
  if(q.length<2){ trefferZeigen([]); return; }
  if(SUCH_ABBRUCH) SUCH_ABBRUCH.abort();
  const ctrl=new AbortController();
  SUCH_ABBRUCH=ctrl;

  const kl=q.toLowerCase();
  const treffer=[];
  const dazu=x=>{
    if(!x || !x.name) return;
    if(treffer.some(y=>y.name.toLowerCase()===x.name.toLowerCase() && (y.abk||'')===(x.abk||''))) return;
    treffer.push(x);
  };

  /* 1) eigenes Verzeichnis — sofort */
  STAMM_BP.filter(([a,n])=>n.toLowerCase().includes(kl)||a.toLowerCase().startsWith(kl))
    .slice(0,8)
    .forEach(([abk,name,lat,lon])=>dazu({abk,name,lat,lon,typ:'Bahnhof',bahn:'SBB',quelle:'Verzeichnis'}));
  trefferZeigen(treffer, 'Suche in den amtlichen Verzeichnissen …');

  /* 2) amtliche öV-Haltestellen — schnell, alle Bahnen, ohne Abkürzung */
  try{
    const r=await fetch(`https://api3.geo.admin.ch/rest/services/api/SearchServer?type=featuresearch`
      + `&features=ch.bav.haltestellen-oev&sr=4326&limit=15&searchText=${encodeURIComponent(q)}`,
      { signal: ctrl.signal });
    const j=await r.json();
    (j.results||[]).map(x=>x.attrs).filter(Boolean).forEach(a=>{
      const k=ausAttrs(a); if(!k) return;
      const name=String(a.label||'').replace(/<[^>]*>/g,'').trim();
      dazu({ abk:'', name, typ:'Bahnhof', bahn:'', lat:k.lat, lon:k.lon, quelle:'öV-Haltestellen' });
    });
  }catch(e){ if(e.name==='AbortError') return; }
  if(ctrl.signal.aborted) return;
  trefferZeigen(treffer, 'Suche Abkürzungen …');

  /* 3) OpenStreetMap — liefert die Abkürzungen, dauert am längsten */
  let osm=[];
  try{ osm=await osmBetriebspunkte(q, ctrl.signal); }
  catch(e){ if(e.name==='AbortError') return; }
  if(ctrl.signal.aborted) return;

  /* Abkürzung aus OSM in bereits gefundene Einträge übernehmen */
  osm.forEach(o=>{
    const vorhanden=treffer.find(t=>!t.abk && t.name.toLowerCase()===o.name.toLowerCase());
    if(vorhanden && o.abk){ vorhanden.abk=o.abk; vorhanden.bahn=vorhanden.bahn||o.bahn;
      vorhanden.typ=o.typ||vorhanden.typ; vorhanden.quelle='öV + OSM'; }
  });
  osm.sort((a,b)=>(b.abk?1:0)-(a.abk?1:0) || a.name.localeCompare(b.name,'de')).forEach(dazu);
  treffer.sort((a,b)=>(b.abk?1:0)-(a.abk?1:0));

  if(treffer.length) trefferZeigen(treffer.slice(0,25));
  else trefferZeigen([], 'Nichts gefunden'+(osm.hinweis?' — '+osm.hinweis:'')+'. Felder von Hand ausfüllen.');
}

  'koordinaten-suchen': async ()=>{
    const offen=S.punkte.filter(p=>!hatKoord(p) && darfStamm(p));
    if(!offen.length){ meldung('Alle Betriebspunkte haben bereits eine Koordinate'); return; }
    let ok=0, fehl=0, i=0;
    for(const p of offen){
      i++; meldung(`Suche ${i} von ${offen.length}: ${p.name} …`);
      const k=await geokodieren(p);
      if(k){
        const {error}=await db.from('betriebspunkt').update({lat:k.lat, lon:k.lon}).eq('id',p.id);
        error ? fehl++ : ok++;
      } else fehl++;
      await new Promise(r=>setTimeout(r,350));
    }
    await alleLaden(); zeichnen();
    meldung(`${ok} Koordinaten gesetzt${fehl?', '+fehl+' nicht gefunden':''}`, fehl>0);
  },
  'verlauf-zurueck': ()=>{ VERLAUF.pop(); zeichnen(); },
  'verlauf-auto': async ()=>{
    const sel=document.getElementById('kz-strecke');
    const st=S.strecken.find(x=>x.id===(sel?sel.value:KARTENZIEL));
    if(!st){ meldung('Keine Strecke gewählt', true); return; }
    if(!darfStamm(st)){ meldung('Nur die erfassende Person oder ein Administrator darf den Verlauf ändern', true); return; }
    try{
      const pfad=await verlaufErmitteln(st);
      const {error}=await db.from('strecke').update({verlauf:pfad}).eq('id',st.id);
      if(error) return fehler(error);
      VERLAUF=[]; await alleLaden(); zeichnen();
      meldung(`${st.name}: Gleisverlauf mit ${pfad.length} Punkten übernommen`);
    }catch(e){ fehler(e); }
  },
  'verlauf-alle': async ()=>{
    const zuwenig=S.strecken.filter(st=>darfStamm(st) && !(Array.isArray(st.verlauf)&&st.verlauf.length>1)
      && (st.punkte||[]).map(punkt).filter(hatKoord).length<2);
    const offen=S.strecken.filter(st=>darfStamm(st) && !(Array.isArray(st.verlauf)&&st.verlauf.length>1)
      && (st.punkte||[]).map(punkt).filter(hatKoord).length>=2);
    if(!offen.length && !zuwenig.length){ meldung('Alle Strecken haben bereits einen Gleisverlauf'); return; }
    let ok=0; const probleme=zuwenig.map(st=>({name:st.name,
      grund:'Weniger als zwei Betriebspunkte mit Koordinate'}));
    for(const st of offen){
      try{
        const pfad=await verlaufErmitteln(st);
        const {error}=await db.from('strecke').update({verlauf:pfad}).eq('id',st.id);
        if(error) probleme.push({name:st.name, grund:error.message}); else ok++;
      }catch(e){ probleme.push({name:st.name, grund:(e&&e.message)||String(e)}); }
      await new Promise(r=>setTimeout(r,1200));
    }
    await alleLaden(); zeichnen();
    if(!probleme.length){ meldung(`${ok} Strecken auf die Gleise gelegt`); return; }
    meldung(`${ok} gelegt, ${probleme.length} offen`, true);
    blattOeffnen('Nicht ermittelbar',()=>`
      <div class="hinweis">Bei diesen Strecken konnte kein Gleisverlauf berechnet werden. Sie bleiben gestrichelt und lassen sich im Modus «Verlauf zeichnen» von Hand nachtragen.</div>
      <div class="liste">${probleme.map(x=>`<div class="punkt">
        <span class="lampe warnung"></span>
        <span class="txt"><span class="n">${esc(x.name)}</span><span class="m">${esc(x.grund)}</span></span>
      </div>`).join('')}</div>`);
  },
  'verlauf-leeren': ()=>{ VERLAUF=[]; zeichnen(); },
  'verlauf-sichern': async ()=>{
    const sel=document.getElementById('kz-strecke');

    if(!darfStamm(st)){ meldung('Nur die erfassende Person oder ein Administrator darf den Verlauf ändern', true); return; }
    if(VERLAUF.length===1){ meldung('Mindestens zwei Stützpunkte nötig', true); return; }
    const {error}=await db.from('strecke').update({verlauf:VERLAUF}).eq('id',sid);
    if(error) return fehler(error);
    VERLAUF=[]; await alleLaden(); zeichnen();
    meldung('Streckenverlauf gesichert');
  },

  'punkt-sichern': async ()=>{
    const abk=$('p-abk').value.trim().toUpperCase(), name=$('p-name').value.trim();
    if(!abk||!name){ meldung('Abkürzung und Name werden benötigt', true); return; }
    const zahl=v=>{ const n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:null; };
    const werte={ abk, name, typ:$('p-typ').value, bahn:$('p-bahn').value.trim(), notiz:$('p-notiz').value.trim(),
      lat:zahl($('p-lat').value), lon:zahl($('p-lon').value) };
    const {error}=ENTWURF.id
      ? await db.from('betriebspunkt').update(werte).eq('id',ENTWURF.id)
      : await db.from('betriebspunkt').insert(werte);
    if(error) return fehler(error);
    const entwurf=STRECKE_ZURUECK;          // vor blattZu sichern, das räumt auf
    blattZu(); await alleLaden(); zeichnen();
    if(entwurf){
      const neuerPunkt=S.punkte.find(x=>x.abk===abk);
      if(neuerPunkt) entwurf.punkte.push(neuerPunkt.id);
      formularStrecke(entwurf.id, entwurf);
      meldung(neuerPunkt?neuerPunkt.name+' eingefügt':'Anlage gesichert');
      return;
    }
    meldung('Anlage gesichert');
    if(werte.lat==null || werte.lon==null){
      const treffer=S.punkte.find(x=>x.abk===abk);
      if(treffer && !hatKoord(treffer)){
        meldung('Anlage gesichert — Koordinate wird gesucht …');
        if(await koordinatenNachziehen([treffer.id])){ await alleLaden(); zeichnen(); meldung('Koordinate gefunden'); }
        else meldung('Keine Koordinate gefunden — auf der Karte von Hand setzen', true);
      }
    }

/* ---------- Beispieldaten ----------
   Abkürzungen und Streckennummern nach der SBB-Übersicht
   "R 30131 Übersicht Streckentabellen" (RADN). Wo die Nummer
   im Plan nicht eindeutig abzulesen war, bleibt sie leer.      */
async function beispieldaten(){
  const bp=STAMM_BP;
  const neu=bp.filter(([abk])=>!S.punkte.some(p=>p.abk===abk))
    .map(([abk,name,lat,lon])=>({abk,name,typ:'Bahnhof',bahn:'SBB',lat,lon}));
  if(neu.length){ const {error}=await db.from('betriebspunkt').insert(neu); if(error) return fehler(error); }
  const {data:alle}=await db.from('betriebspunkt').select('id,abk');
  const karte={}; (alle||[]).forEach(p=>karte[p.abk]=p.id);

  /* [BAV-Streckennummer, Streckentabelle R 30131, Name, km, Betriebspunkte]
     BAV-Nummern nur dort eingetragen, wo belegt — die übrigen auf der
     Kartenebene "Schienennetz BAV" ablesen und nachtragen.            */
  const str=[
    ['',   '111','Genève – Lausanne','60',['GE','LS']],
    ['',   '211','Lausanne – Sion','107',['LS','MG','SIO']],
    ['',   '221','Sion – Brig','48',['SIO','VI','BR']],
    ['',   '222','Brig – Iselle (Simplon)','23',['BR','ISE']],
    ['',   '322','Thun – Spiez – Frutigen','22',['TH','SP','FR']],
    ['',   '351','Frutigen – Brig (Lötschberg-Bergstrecke)','52',['FR','BR']],
    ['',   '361','Spiez – Interlaken Ost','25',['SP','IO']],
    ['',   '371','Bern – Thun','31',['BN','TH']],
    ['',   '391','Frutigen – Visp (Lötschberg-Basistunnel)','40',['FR','VI']],
    ['',   '411','Basel SBB – Olten (Hauenstein-Basislinie)','39',['BS','PR','SIS','OL']],
    ['600','531','Luzern – Arth-Goldau – Göschenen','76',['LZ','GD','AL','GOE']],
    ['600','541','Göschenen – Bellinzona','86',['GOE','BEL']],
    ['',   '602','Zürich HB – Winterthur','28',['ZUE','OGL','W']],
    ['',   '711','Winterthur – St. Gallen','58',['W','WL','GSS','SG']],
    ['',   '',   'Olten – Bern','62',['OL','LGUT','BDF','BN']],
    ['',   '',   'Olten – Zürich HB','65',['OL','AA','BRGG','BAD','ZUE']],
    ['',   '',   'Zürich HB – Chur','120',['ZUE','ZB','SA','CH']]
  ];
  for(const [linie,tabelle,name,km,codes] of str){
    if(S.strecken.some(s=>s.name===name)) continue;
    const {data,error}=await db.from('strecke').insert({name,linie,tabelle,km}).select().single();
    if(error){ fehler(error); continue; }
    await db.from('strecke_punkt').insert(codes.map((c,i)=>({strecke_id:data.id,punkt_id:karte[c],reihenfolge:i})));
  }
  meldung('Beispieldaten geladen — BAV-Nummern nachtragen');
}

function zeichnen(){
  const an = !!(S.user && S.profil);
  document.body.classList.toggle('angemeldet', an);
  $('kopf').hidden = !an; $('navigation').hidden = !an;
  if(!an){ $('ansicht').innerHTML=ansichtTor(); return; }

  if(ANSICHT==='team' && !istAdmin()) ANSICHT='uebersicht';
  $('kennung').innerHTML = `${esc(S.profil.name||S.user.email)} <span class="rollenschild ${istAdmin()?'admin':''}">${istAdmin()?'ADMIN':FKURZ[fkt(S.profil)]}</span>`;

  const seiten={uebersicht:ansichtUebersicht,strecken:ansichtStrecken,anlagen:ansichtAnlagen,
    karte:ansichtKarte,journal:ansichtJournal,team:ansichtTeam,konto:ansichtKonto};
  if(ANSICHT!=='karte' && KARTE){ KARTE.remove(); KARTE=null; }
  $('ansicht').innerHTML=seiten[ANSICHT]();
  if(ANSICHT==='karte') karteAufbauen();

  $('navigation').innerHTML=TABS.filter(([k])=>k!=='team'||istAdmin())
    .map(([k,t,ik])=>`<button class="${ANSICHT===k?'an':''}" data-tat="nav" data-wert="${k}"><svg viewBox="0 0 24 24">${ik}</svg>${t}</button>`).join('');

  const f=$('suchfeld');
  if(f) f.addEventListener('input',()=>{
    SUCHE=f.value; const pos=f.selectionStart; zeichnen();
    const n=$('suchfeld'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
  });
}

document.addEventListener('click',ev=>{
  const ziel=ev.target.closest('[data-tat]'); if(!ziel) return;
  const tat=TATEN[ziel.dataset.tat];
  if(tat){ ev.preventDefault(); tat(ziel); }
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='k-person'){
    KARTENPERSON=ev.target.value;
    KARTENMODUS='ansehen'; VERLAUF=[];
    zeichnen();
  }
});
document.addEventListener('input',ev=>{
  if(ev.target.id==='p-suche'){
    clearTimeout(SUCHLAUF);
    const wert=ev.target.value;
    SUCHLAUF=setTimeout(()=>bpSuchen(wert), 650);
  }
});
document.addEventListener('change',async ev=>{
  if(ev.target.id!=='f-bpwahl' || !ev.target.value || !ENTWURF) return;
  let wert=ev.target.value;
  ev.target.value='';
  if(wert==='suchen'){
    const merker={...ENTWURF, punkte:[...ENTWURF.punkte]};
    formularPunkt(null);
    STRECKE_ZURUECK=merker;   // nach formularPunkt setzen, blattZu räumt sonst auf
    return;
  }
  if(wert.startsWith('neu:')){
    const abk=wert.slice(4);
    const eintrag=STAMM_BP.find(x=>x[0]===abk);
    if(!eintrag) return;
    meldung(eintrag[1]+' wird angelegt …');
    const {data,error}=await db.from('betriebspunkt').insert({
      abk:eintrag[0], name:eintrag[1], typ:'Bahnhof', bahn:'SBB', lat:eintrag[2], lon:eintrag[3]
    }).select().single();
    if(error){ fehler(error); return; }
    S.punkte.push(data);
    wert=data.id;
    const sel=$('f-bpwahl'); if(sel) sel.innerHTML=bpAuswahlHtml();
    meldung(eintrag[1]+' angelegt und eingefügt');
  }
  ENTWURF.punkte.push(wert);
  zeichneBpWahl();
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('hintergrund').hidden) blattZu();
  if(ev.key==='Enter'&&ev.target.tagName==='INPUT'&&ev.target.closest('.tor')){
    ev.preventDefault(); const b=document.querySelector('.tor .btn.haupt'); if(b) b.click();
  }
});
$('hintergrund').addEventListener('click',ev=>{ if(ev.target===$('hintergrund')) blattZu(); });

async function sitzungWechsel(session){
  if(session && session.user){
    S.user=session.user;
    const {data,error}=await db.from('profil').select('*').eq('id',S.user.id).maybeSingle();
    if(error){ fehler(error); return; }
    if(!data){
      const {data:neu,error:e2}=await db.from('profil').insert({id:S.user.id,name:S.user.email}).select().single();
      if(e2){ fehler(e2); return; }
      S.profil=neu;
    } else S.profil=data;
    await alleLaden();
    ANSICHT='uebersicht';
  } else { S.user=null; S.profil=null; }
  zeichnen();
}

if(db){
  db.auth.onAuthStateChange((_e,session)=>{ sitzungWechsel(session); });
  (async ()=>{
    try{ const {data}=await db.auth.getSession(); await sitzungWechsel(data.session); }
    catch(e){ startfehler('Verbindung zu Supabase fehlgeschlagen: '+(e.message||e)); }
  })();
}
